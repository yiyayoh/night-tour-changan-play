<script id="palaceContent" type="application/json">{"id":"palace-night","title":"太极宫 · 贞观夜话","subtitle":"宫门入夜，一页奏议还未落印。","boundary":"以贞观人物所在的长安大内为背景，依据文献与遗址研究重建宫门、朝庭和内廷的空间秩序。太极宫未获全面发掘，本作门殿尺寸、间距、屋顶、配殿和装饰为研究性推定，非全宫一比一测绘复原；人物画像、陈设、来访与对谈仍为原创。太极宫是后世通称，贞观时称大内。","architecture":{"title":"循史营造 · 长安大内","intro":"从承天门，经太极门与太极殿前庭，再入两仪殿，向后寝与苑囿延伸。此次重做的是可步行的宫城核心游览段，不把推定的间架和尺度说成出土实测。","documented":["承天门、太极殿、两仪殿形成外朝、中朝、内朝的前后秩序。","承天门采用已探三门道方案；遗址不完整，完整门阙形制仍有讨论。","太极宫残图为宋元丰三年刻图，可参考殿名与区域关系，不能直接当成贞观现场测绘图。"],"inferred":["殿堂采用宽展屋面、深出檐、柱础、圆木朱柱、梁枋与大斗栱。曲面屋坡、瓦列、直棂窗、脊端鸱尾按唐构类型推定。","佛光寺东大殿是857年的佛殿，晚于贞观两百余年；仅借鉴保存的木构类型，不当作初唐宫殿原件。","本作太极殿的十一间柱网、屋顶形式、灰瓦设色、台基高度及门殿间距均为设计推定。侧楼、配殿、长廊和后苑位置同样不是已证实的太极宫遗址坐标。"],"story":"议事廊、后苑书阁与六件物证沿用原故事。宫中三人的来访、任务、手札与相约不代表史载事件；故事所处年代不混入高宗时期的大明宫含元殿。","features":["承天门三门道、连续门楼楼板与承梁","太极门与开阔朝庭","太极殿台基、木构与庑殿式曲面屋顶","开敞朝堂、封闭书阁、后寝与亭廊分别设计","青灰砖铺装、土色庭地与石阶分区","木质实体匾额，繁体楷书按传统方向排字","原三位人物与全部任务保留"],"sources":[{"title":"陕西省志·建设志，第86页：长安宫城与太极宫","url":"https://dfz.shaanxi.gov.cn/zslm/fzzlk/xbsxsz/szdylpdf/201404/P020240923623109161543.pdf"},{"title":"西安碑林博物馆：太极宫残图（宋，1080）","url":"https://beilin-museum.com/index.php?a=index&aid=3400&c=View&m=home"},{"title":"香港教育局：中国木构建筑馆之模型，第2—3页","url":"https://www.edb.gov.hk/attachment/sc/curriculum-development/kla/pshe/references-and-resources/ethics-and-religious-studies/Nan_Lian_Garden/3iii_sc.pdf"}]},"intro":"你替宫中校书递送一页未定稿的修缮议。仓廊漏雨，殿饰也待更新；同一批木料、同一册工数，该先送往何处？先看物证，再听三人各说一句，最后由你替这页奏议留下一个落款。","characters":[{"id":"wei-zheng","name":"魏徵","role":"谏臣 · 议事廊","portrait":"wei-zheng.webp","era":"初唐 · 贞观时期","summary":"直言之前，先把账与实情看清。","history":"魏徵字玄成。早年曾事李建成，唐太宗即位后任用他为谏议大夫，后参与朝政。史籍记其多次进谏，也记他参与整理图籍、撰修史书；其形象不只是一位当面争辩的臣子。","note":"本卷借其进谏与恤民的思想设置修缮之议。廊中工簿、仓廊雨损及你与他的问答均为原创，不是史载的一次奏对。","sources":[{"title":"《旧唐书》卷七十一 · 魏徵传","url":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"},{"title":"《贞观政要》卷二 · 任贤、求谏","url":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"}]},{"id":"empress-zhangsun","name":"长孙皇后","role":"文德皇后 · 后苑书阁","portrait":"empress-zhangsun.webp","era":"初唐 · 贞观时期","summary":"一寸衣料，也有宫墙之外的分量。","history":"长孙氏是唐太宗的皇后，后谥文德。史籍记她喜好读书、生活俭约，并劝太宗不要因自己的亲属关系过度任用外戚。她的个人名未见可靠记载，本卷不用后世虚构姓名替代史实。","note":"书阁与旧衣料是表现俭约主题的原创布景，不据此断言她曾在此处裁衣，或主持这份修缮议。画中服饰与面容也是艺术想象。","sources":[{"title":"《旧唐书》卷五十一 · 文德皇后长孙氏","url":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"}]},{"id":"li-shimin","name":"李世民","role":"唐太宗 · 两仪殿意象","portrait":"li-shimin.webp","era":"初唐 · 贞观时期","summary":"落印容易，容得下不同的声音更难。","history":"李世民是唐朝第二位皇帝，庙号太宗，年号贞观。其统治与任贤、纳谏的政治记忆相连；他也经历了激烈的皇位争夺，不能把帝王的一生简化成没有矛盾的明君故事。","note":"本卷取纳谏与慎用民力的议题，不以你的选择改写真实诏令。两仪殿仅借历史殿名营造议事空间，台阶、陈设与夜间接见均未作考古复原。","sources":[{"title":"《旧唐书》卷二 · 太宗本纪上","url":"https://zh.wikisource.org/zh-hans/舊唐書/卷2"},{"title":"《贞观政要》卷二","url":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"}]}],"evidence":[{"id":"rain-report","name":"仓廊雨损簿","place":"议事廊","text":"纸上圈出三处漏缝，旁注：梁架尚稳，先补顶便可护粮。末尾另有一行细字——殿上彩绘褪色，尚未碍用。","object":"案上展开的雨损图"},{"id":"work-ledger","name":"木料与工簿","place":"议事廊","text":"库中余木足补漏顶；若连殿饰一并更新，便须另征工役。簿边压着一小块旧木：换一处新色，未必只耗这一寸木。","object":"压着旧木的工簿"},{"id":"silk-book","name":"衣料旧册","place":"后苑书阁","text":"新样册的封皮光亮，旧册却添了许多小注：未损可留，旧缣可补。你翻到最后，余料一项尚未写定去向。","object":"书案上的衣料册"},{"id":"plain-sleeve","name":"素衣与补线","place":"后苑书阁","text":"木架上挂着一段素色袖料，补线细而牢。它不炫目，却仍可用。阁中没有谁替你算好结论，只留下一个问题：体面一定要靠添新吗？","object":"木架上的素衣袖料"},{"id":"court-draft","name":"未落印的奏议","place":"两仪殿意象","text":"殿饰与仓廊被写在同一行，仿佛同样急迫。你将廊中所见另附一纸，纸的边缘仍留着魏徵圈点的墨痕。","object":"御案左侧的奏议"},{"id":"court-map","name":"宫门外的田畴图","place":"两仪殿意象","text":"图上并没有画出每一户人家，只有几道水渠和田垄。可工簿上每增一笔，都会有人离开这些田垄。夜深了，落款的地方仍是空白。","object":"御案右侧的田畴图"}],"chapters":[{"id":"remonstrance","person":"wei-zheng","name":"廊下听直言","needs":["rain-report","work-ledger"],"line":"魏徵把两册并排放下：『若把想做之事都写成急务，百姓便没有不忙的时候。你看过了，要怎样分这一批木料？』","choices":[{"id":"repair","label":"先补仓廊漏顶，殿饰缓修","reply":"『先后分明，才不是一句空泛的节用。』他把修缮次序写在纸边，却没有替你封住其他人的意见。"},{"id":"survey","label":"先核损情与工数，再分项列议","reply":"『求证也须给出期限，免得粮食只等来一叠新纸。』他在仓廊一栏加了急记，令你的复核有了轻重。"}]},{"id":"restraint","person":"empress-zhangsun","name":"书阁惜一寸","needs":["silk-book","plain-sleeve"],"line":"长孙皇后合上书：『取用之物，并非越新越合宜。若省下的只在册上好看，便还没省到地方。你愿怎样记这笔余料？』","choices":[{"id":"reuse","label":"先用可用旧料，余缣转作修补","reply":"她轻按那道补线：『物尽其用，也要让用物的人知道为何如此。』旧册添了一页去向，素衣没有被匆忙丢弃。"},{"id":"separate","label":"礼用与修缮分册核记，余料暂存","reply":"『分册之后，仍要相互看得见。』她将两册系在一起，提醒你规整的账目不能代替最后的照应。"}]},{"id":"audience","person":"li-shimin","name":"殿前留一言","needs":["court-draft","court-map"],"line":"李世民看完附纸，没有立刻取印：『若只要一份顺耳的答复，不必让你走这一程。现在，有人求快，有人求细，你愿替这页奏议留下什么？』","choices":[{"id":"seal","label":"先护仓粮，把不同意见一并附卷","reply":"印落在先护仓粮的一行，旁边仍留着未被划去的异议。殿门开启，纸上的工数终于有了清楚的去处。"},{"id":"recheck","label":"限定明日复核，今夜先作临时护盖","reply":"奏议没有强作定论，临时护盖却先送了出去。你把明日的期限写在封面，留下的是责任，并非一页无声的拖延。"}]}],"endings":{"lantern":{"title":"省一盏灯","text":"殿饰暂缓，余材先护仓粮。后苑一排装饰灯歇下，案上却多留了一盏读异议的灯。你带走的不是替古人作出的史实判决，而是这次夜访留下的取舍。"},"records":{"title":"两册并存","text":"仓廊先得修补，工数与用料各有去处。两份意见并排收进卷中：有了结论，也仍容得下日后核问。你没有把分歧抹平，只让它们留下可追索的字。"},"dawn":{"title":"灯下留议","text":"夜里的护盖先行，明日的复核有期。宫门将启时，案上仍留着未落的印；它不再是一种犹豫，而是一件有人接手、有人记得的事。"}},"sources":[{"title":"西安碑林博物馆 · 太极宫残图","url":"https://beilin-museum.com/index.php?a=index&aid=3400&c=View&m=home"},{"title":"《贞观政要》卷二","url":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"}]}</script>
