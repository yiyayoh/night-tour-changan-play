<script src="/night-tour-changan-play/assets/changan-pages-cloud.js?v=f9e490412e705d43"></script><script>if(!['borrowed-lantern','paper-door','painted-skin','nie-xiaoqian','cricket'].includes(new URLSearchParams(location.search).get('tale-scene'))){
window.CHANGAN_CHARACTER_PLAY={"characters":{"xishi":{"name":"西施","greeting":"越水夜深，先坐一会儿吧。若你愿意听，我们从书页里辨一辨那些关于我的故事。","questions":[{"id":"xishi-q1","prompt":"客人，吴越故事把我的身影放在哪一段时代里？","options":["盛唐的长安","春秋末年的吴越","西汉的塞外"],"answer":1,"reply":"《吴越春秋》把西施置于勾践与吴王的叙事中；这是晚于事件写成的吴越故事，不能当作同时期实录。","sourceLabel":"《吴越春秋》卷九","sourceUrl":"https://zh.wikisource.org/wiki/吳越春秋/第009卷"},{"id":"xishi-q2","prompt":"宫墙之前，哪些早期典籍已经写到西施之名？","options":["《旧唐书》与《新唐书》","《汉书》与《后汉书》","《墨子》与《庄子》"],"answer":2,"reply":"《墨子·亲士》已提到西施，《庄子·天运》也有相关寓言。早期文本多用她说理，并非完整生平。","sourceLabel":"《墨子·亲士》","sourceUrl":"https://zh.wikisource.org/wiki/墨子/親士"},{"id":"xishi-q3","prompt":"若依《吴越春秋》的叙事，该从哪座山寻找我的来处？","options":["苎萝山","终南山","骊山"],"answer":0,"reply":"该卷将西施与郑旦称作苎萝山鬻薪之女。这里说的是后出文本的记载，不是已能复原的个人身世。","sourceLabel":"《吴越春秋》卷九","sourceUrl":"https://zh.wikisource.org/wiki/吳越春秋/第009卷"},{"id":"xishi-q4","prompt":"那卷吴越旧事里，与西施一同被选出的女子叫什么？","options":["王昭君","郑旦","貂蝉"],"answer":1,"reply":"《吴越春秋》把西施与郑旦并写，随后叙述两人受教并被献入吴国。阅读时也应记住郑旦的名字。","sourceLabel":"《吴越春秋》卷九","sourceUrl":"https://zh.wikisource.org/wiki/吳越春秋/第009卷"},{"id":"xishi-q5","prompt":"书中写我入吴之前受教，具体提到了什么？","options":["容仪与步态","边塞骑射","写作唐诗"],"answer":0,"reply":"原文提到服饰与容步的学习。它提供后世叙事中的礼仪线索，不能据此证明西施本人全部的才能或想法。","sourceLabel":"《吴越春秋》卷九","sourceUrl":"https://zh.wikisource.org/wiki/吳越春秋/第009卷"},{"id":"xishi-q6","prompt":"有人急着替我写下最后一页，你认为应怎样读我的结局？","options":["已确定随范蠡终老","已确定留居唐代长安","保留异说，不把结局写成定论"],"answer":2,"reply":"《墨子·亲士》在说理语境提到西施之沉，并未展开她的生平。早期简短文字与后来的故事，无法合成一个无疑的结局。","sourceLabel":"《墨子·亲士》","sourceUrl":"https://zh.wikisource.org/wiki/墨子/親士"}],"rewards":[{"threshold":10,"title":"越岸听水","text":"暮色落在水面，芦叶一半青，一半映着灯火。西施将一块平石推到你身旁：“这里坐得下两个人。”你问远处是什么地方，她没有急着答，只让你先听岸边的小浪。那水声既不像宫中的丝竹，也不肯替谁讲功业。待风静些，她才笑道：“今夜，先记住这条河吧。人来过的地方，总值得慢慢看。”","basis":"原创梦中小记。越地水岸取自吴越叙事的地域线索；人物言语、动作与相遇均属想象。","sourceLabel":"《吴越春秋》卷九","sourceUrl":"https://zh.wikisource.org/wiki/吳越春秋/第009卷"},{"threshold":30,"title":"容步之外","text":"庭中只点着一盏小灯，青石的边缘被照得很清楚。西施走了几步，又停下来，问你：“若有人只记得我如何转身，会不会忘记我原本想往哪里去？”你把灯挪向门边，让那条路也亮起来。她望了片刻，收起刻意放缓的步子。离开庭院时，衣角掠过草尖，夜风没有要求她再重复一次。","basis":"原创梦中小记。《吴越春秋》写容步受教；关于人物愿望及步态的具体对话，为作者想象。","sourceLabel":"《吴越春秋》卷九","sourceUrl":"https://zh.wikisource.org/wiki/吳越春秋/第009卷"},{"threshold":60,"title":"留白的一页","text":"河上有雾，远处的小舟看不清归路。你想问西施后来去了哪里，她却递来一页没有题字的纸：“若书里没有我的回答，你可愿意替我留一点空白？”你没有写下一个圆满的结局，只画了岸、一盏灯和仍向远处延伸的水。她把纸压在石下，与你并肩望向夜色。这一页的末尾，终于容得下一段无人催促的沉默。","basis":"原创梦中小记。留白回应西施生平与结局难以确证的边界；不为泛湖或沉江异说新增证据。","sourceLabel":"《墨子·亲士》","sourceUrl":"https://zh.wikisource.org/wiki/墨子/親士"}],"journey":{"quest":{"title":"把水声织进空白","intro":"这是一场借长安景物织成的越地梦。西施托你寻一缕水声、一段素线和一页空笺，留给那些未被书写的日常。","steps":[{"id":"xishi-step1","title":"月桥听水","clue":"去月桥岸边，不必过桥；听水绕过岸石，留住最轻的一声。","place":"bridgehead","object":"chime","actionLabel":"留住水声","foundText":"你停在岸上，听小浪退去。梦中的小铃收进一声清响，仿佛素线开始穿过织机。"},{"id":"xishi-step2","title":"坊巷拾线","clue":"坊巷灯影里，有一段未染色的素线。沿低檐寻找那一点柔白。","place":"alley","object":"ribbon","actionLabel":"收起素线","foundText":"素线没有华丽的花纹。你将它绕好，留下足够长的一端，让这一夜还能接着织下去。"},{"id":"xishi-step3","title":"驿舍留笺","clue":"城西驿舍有一页空笺。替梦记下水与线，末尾留一点空白。","place":"inn","object":"poem","actionLabel":"留下空白","foundText":"你没有替她写定归处，只在纸角画一圈水纹。纸上的空白，终于也成为故事的一部分。"}]},"conversation":{"prompt":"西施望向空笺：若把水声与素线寻回，这一页，你还想留下什么？","choices":[{"id":"listen","label":"先听你说，不急着落笔","response":"“那就把纸放下吧。”她望向水面，“有些话，要在不被催促的时候才说得出来。”","endingTitle":"水边慢谈","endingText":"你们让纸留在石旁，把更长的时间交给谈话。水声没有替谁作答，却容得下一句尚未说完的话。"},{"id":"ask","label":"这一夜，你愿往哪里走？","response":"“今夜先沿水走。”她轻轻提起衣角，“不是替后来的故事选结局，只是我此刻愿走的路。”","endingTitle":"沿水一程","endingText":"梦里的小路向芦影延伸。你将灯照向她选择的方向，把今夜的一程留作相遇，不写成生平的答案。"},{"id":"help","label":"我来护住纸角，你来写","response":"“好，别让风先替我翻页。”她接过笔，在纸上留下一道短短的水纹。","endingTitle":"由她落笔","endingText":"你的手压住纸角，她的笔沿着水纹停下。这一页没有完成所有故事，却留住了由她落笔的片刻。"}]},"vignette":{"title":"知音 · 水纹不催归","lines":["西施把素线轻放在石上：“你寻回的水声，像一匹还没有织完的布。”","“今夜不用替我补上结局。就在这里，听它慢慢流过岸边吧。”","她将空笺挪到两人之间：“这一页留给水，也留给愿意陪我停步的人。”"],"closing":"灯影在水里舒展，未写完的纸没有被翻走。"}}},"wang-zhaojun":{"name":"王昭君","greeting":"长风吹过汉塞，也吹到今夜的灯前。坐下谈谈吧，别只看远行的背影，也读一读那些请求。","questions":[{"id":"wang-zhaojun-q1","prompt":"客人，你知道史书把我的远行记在哪个朝代吗？","options":["东汉末年","唐代","西汉"],"answer":2,"reply":"《汉书·匈奴传》记汉元帝时王昭君出行匈奴。她属于西汉叙事，不能与唐代长安人物当作同时代相识。","sourceLabel":"《汉书》卷九十四下","sourceUrl":"https://zh.wikisource.org/wiki/漢書/卷094下"},{"id":"wang-zhaojun-q2","prompt":"《汉书》写我成为谁的阏氏？","options":["呼韩邪单于","董卓","唐玄宗"],"answer":0,"reply":"《汉书》记汉元帝将王昭君赐予呼韩邪单于，并记宁胡阏氏之号。","sourceLabel":"《汉书》卷九十四下","sourceUrl":"https://zh.wikisource.org/wiki/漢書/卷094下"},{"id":"wang-zhaojun-q3","prompt":"“宁胡阏氏”里的“阏氏”，是哪一类称号？","options":["宫廷女官的官名","单于配偶的称号","一支唐代舞曲的名称"],"answer":1,"reply":"昭君在《汉书》中被称宁胡阏氏；阏氏是匈奴单于配偶使用的称号，并非汉朝女官职名。","sourceLabel":"《汉书》卷九十四下","sourceUrl":"https://zh.wikisource.org/wiki/漢書/卷094下"},{"id":"wang-zhaojun-q4","prompt":"哪部史书补写了我在汉宫主动请求出行？","options":["《三国演义》","《吴越春秋》","《后汉书》"],"answer":2,"reply":"《后汉书·南匈奴列传》写昭君入宫数年未得召见，因而请求出行。这一细节须注明是该书的叙述。","sourceLabel":"《后汉书》卷八十九","sourceUrl":"https://zh.wikisource.org/wiki/後漢書/卷89"},{"id":"wang-zhaojun-q5","prompt":"呼韩邪死后，《后汉书》还记下了我的哪次请求？","options":["上书求归汉","请求在长安修舞台","请求入道号太真"],"answer":0,"reply":"该书记昭君上书求归，成帝命她依当地习俗，未准其归汉。求行与求归让读者看见不同处境下的个人意愿。","sourceLabel":"《后汉书》卷八十九","sourceUrl":"https://zh.wikisource.org/wiki/後漢書/卷89"},{"id":"wang-zhaojun-q6","prompt":"关于拒贿画工、按画像选人的故事，应该到哪里读？","options":["当作两部汉书共同证实的事实","《西京杂记》，并注明故事层次","当作昭君亲笔留下的回忆"],"answer":1,"reply":"《西京杂记》卷二写王嫱不肯贿赂画工的故事。它与两部汉书的记载应分层阅读，不能混作共同证实的史实。","sourceLabel":"《西京杂记》卷二 · 画工故事","sourceUrl":"https://zh.wikisource.org/wiki/西京雜記/卷二"}],"rewards":[{"threshold":10,"title":"风里的小灯","text":"塞外的夜像一幅展开的深蓝帛画，灯罩被风碰得轻响。昭君拿石子压住地图，却把一角留给你：“看路时，也看看路旁的人。”你沿着图上细细的线，想象驿亭里递水的手，帐前等待归人的目光。她将灯转向背风处，火苗安静下来。远行忽然不再只是地图上的长线，还有每一步都要面对的寒暖。","basis":"原创梦中小记。远行匈奴依《汉书》记载；地图、灯与此处对话为虚构，不指认真实路线或季节。","sourceLabel":"《汉书》卷九十四下","sourceUrl":"https://zh.wikisource.org/wiki/漢書/卷094下"},{"threshold":30,"title":"两次请求","text":"你带来两张写着“去”与“归”的纸，原以为它们彼此矛盾。昭君把纸并排放下，轻轻问：“人在不同的时日，难道不能有不同的愿望？”灯影落在空白处，你终于没有替她解释一生，只听她把一句话慢慢说完。帐外的风仍旧很大，纸却没有被吹走；你替她压住边角，把未说出口的部分也好好留下。","basis":"原创梦中小记。《后汉书》记求行与求归；两张纸及人物心境是创作，不是史书记下的对话。","sourceLabel":"《后汉书》卷八十九","sourceUrl":"https://zh.wikisource.org/wiki/後漢書/卷89"},{"threshold":60,"title":"山河与故音","text":"这一夜，你们没有谈宫门，也没有计算塞外有多少里。昭君请你说一个故乡最寻常的声音，你说是雨后屋檐滴水。她听了很久，在灯旁留下一只盛着清水的碗：“让今夜也有一点屋檐吧。”远山被云遮住，碗里却有细小的亮光。你知道这不是替远行写一个轻巧的答案，只是给长路上的人，留下片刻可以停靠的安静。","basis":"原创梦中小记。以史籍所载远行与求归为创作触发；水碗、故乡声音和人物反应均属想象。","sourceLabel":"《后汉书》卷八十九","sourceUrl":"https://zh.wikisource.org/wiki/後漢書/卷89"}],"journey":{"quest":{"title":"为长路留一盏灯","intro":"这场原创远行梦借长安的檐声与灯火成形。昭君请你收下三件微小的行囊：一声屋檐铃、一盏背风灯、一页可以写下故音的纸。","steps":[{"id":"wang-zhaojun-step1","title":"檐下收音","clue":"去坊巷灯影，听低檐下的小铃。故乡的声音，也许就藏在寻常人家旁。","place":"alley","object":"chime","actionLabel":"收下檐铃声","foundText":"铃声很轻，不盖过邻家的脚步。你记住这一响，连同屋檐下有人生活的温度。"},{"id":"wang-zhaojun-step2","title":"城门护灯","clue":"明德门内有一盏待收的小灯。替它寻一个背风处，让亮光稳下来。","place":"gate","object":"lantern","actionLabel":"护住灯火","foundText":"你将灯罩转向背风一侧。火光稳住后，照亮的先是脚边这一步，而不是遥远的终点。"},{"id":"wang-zhaojun-step3","title":"驿前记故音","clue":"到城西驿舍，取那张空白曲笺。写下一个你记得的声音，留给梦中的远行人。","place":"inn","object":"score","actionLabel":"记下故音","foundText":"你在纸上记一阵檐铃、一声门响。它们未必能缩短长路，却能让行囊装下地图之外的东西。"}]},"conversation":{"prompt":"昭君轻扶灯罩：若这只行囊还能装下一句话，你想放什么？","choices":[{"id":"listen","label":"装下你此刻想说的话","response":"“我想说，走得再远，也会想念一些很小的事。”她望着灯芯，“你肯听，它们便不算太小。”","endingTitle":"行囊里的细声","endingText":"你没有催她谈山河，只听她说灯前的小事。细小的声音被认真收好，行囊因此有了一处柔软的内里。"},{"id":"ask","label":"怎样才算把一条路看清？","response":"“别只量远近，也看谁递水、谁等在门前。”她将灯转来，“一条路上，有许多人的冷暖。”","endingTitle":"灯照路旁","endingText":"这一夜你们重新看待远行：灯照着道路，也照着路旁的人。游记里多了一页未被里程标出的停靠。"},{"id":"help","label":"我陪你把灯转向背风处","response":"“那就一起慢一点。”她扶住灯罩，“先护好眼前这一点亮，明日的路明日再看。”","endingTitle":"背风同灯","endingText":"两双手让一盏灯稳下来。远处仍然辽阔，你们先把眼前的冷风挡住，让这个片刻足够温暖。"}]},"vignette":{"title":"知音 · 长风有停处","lines":["昭君将曲笺压在灯下：“你带回的铃声，让这只行囊有了屋檐。”","“陪我再听一会儿吧。不必把长路说得轻巧，也不必一直说离别。”","她留出灯旁的座位：“若风又起，今夜我们知道，该把灯转向哪里。”"],"closing":"纸角安静下来，远山之外的风仍有回声。"}}},"diaochan":{"name":"貂蝉","greeting":"月已到庭中，故事还没有开场。我从小说的书页而来，愿与你聊聊歌舞、胆识和被安排的人生。","questions":[{"id":"diaochan-q1","prompt":"客人，若要听到“貂蝉”这个有姓名、有言语的形象，先读哪部书？","options":["《三国演义》","《汉书》","《旧唐书》"],"answer":0,"reply":"《三国演义》塑造了有姓名与行动的貂蝉。她应作为文学人物介绍，不宜填写未经证实的真实生卒。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"},{"id":"diaochan-q2","prompt":"小说第八回的月夜开场，我在谁的府中？","options":["呼韩邪单于","王允","勾践"],"answer":1,"reply":"第八回称貂蝉为王允府中歌伎，并叙述她在花园中的月夜与王允相遇。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"},{"id":"diaochan-q3","prompt":"小说写王允教我什么，让歌伎的身份有了具体内容？","options":["边塞骑射","修筑城墙","歌舞"],"answer":2,"reply":"《三国演义》第八回写王允教貂蝉歌舞。这里的才艺属于小说设定，并非正史给出的个人履历。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"},{"id":"diaochan-q4","prompt":"王允提出的连环计，主要要离间哪两个人？","options":["董卓与吕布","范蠡与勾践","玄宗与李白"],"answer":0,"reply":"小说安排貂蝉参与离间董卓与吕布的计谋。这是小说情节，不应改写为正史完整记载。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"},{"id":"diaochan-q5","prompt":"小说第八回把董卓、王允等人的这段故事放在哪座城？","options":["洛阳之外的唐代村落","汉代南郡","长安"],"answer":2,"reply":"第八回开篇说明董卓在长安，随后展开王允与貂蝉的连环计故事。此处是汉末的小说长安，与盛唐有时代差别。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"},{"id":"diaochan-q6","prompt":"《三国志·吕布传》提到吕布与董卓侍婢私通，能由此确认什么？","options":["侍婢名字就是貂蝉","有这段记载，但未载侍婢姓名","侍婢与王允的亲属关系"],"answer":1,"reply":"《三国志》该段只记一名侍婢，没有写出姓名与身世。不能直接将她认定为小说中的貂蝉。","sourceLabel":"《三国志》卷七 · 吕布传","sourceUrl":"https://zh.wikisource.org/wiki/三國志/卷07"}],"rewards":[{"threshold":10,"title":"月庭停步","text":"庭院里的月光分成几块，恰好避开她踏过的青石。貂蝉收起舞袖，没有立即让下一段故事开始：“你若只来看一场舞，我可以跳；你若愿意听，我也可以说。”你把座位挪到灯旁，为她留出能看见门口的地方。她望了望那条亮着的小路，终于放缓声音。台上的名字，在这一夜也有了开口之前不必被催促的片刻。","basis":"原创小说人物小记。歌舞身份取自《三国演义》；月庭相谈与具体动作是新创作，不是原著续写史实。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"},{"threshold":30,"title":"扇后的两面","text":"貂蝉把一柄素扇递来，扇上没有花，只画着一道门。你翻到背面，看见另一道门，方向恰好相反。“从一边看，总像有人能轻易走出去。”她将扇放平，示意你看看中间细窄的折痕。你没有急着为故事中的任何选择喝彩，只问她此刻想把灯放在哪边。她指向庭院中央，让两条路都先明亮起来。","basis":"原创小说人物小记。扇与门的隐喻回应原著中计谋与婚姻安排的困境；不声称人物真实心理可考。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"},{"threshold":60,"title":"帷幕之后","text":"帷幕缓缓落下，庭中不再有人喊出英雄的名字。貂蝉把袖上的一片落叶摘下来，问你：“故事散场之后，读者会不会还记得台上的人需要歇一歇？”你替她收好小灯，却没有给那本书添上一个笃定的生平。她坐在月光与灯光之间，将素扇轻轻合起。今夜留给她的，是一段没有掌声，也无需向任何人证明胆识的安静。","basis":"原创小说人物小记。借原著的歌舞与危险处境展开想象；散场情景不补写貂蝉的历史结局。","sourceLabel":"《三国演义》第八回 · 小说情节","sourceUrl":"https://zh.wikisource.org/wiki/三國演義/第008回"}],"journey":{"quest":{"title":"让月庭留一扇门","intro":"貂蝉从小说书页走入这场原创月庭梦。她托你借长安三处灯影布一方小舞台：留住自己的声音，照见可以选择的路，也让散场的人有处休息。","steps":[{"id":"diaochan-step1","title":"听见帘后","clue":"坊巷灯影的低檐旁挂着小铃。先听它响完，再替这场梦开幕。","place":"alley","object":"chime","actionLabel":"听完一声铃","foundText":"你没有急着催开帷幕。铃声的尾音散去，帘后那个尚未出场的人，也获得了准备的时间。"},{"id":"diaochan-step2","title":"照见两条路","clue":"朱雀长街的灯旁有一盏小灯。将它留在路口，让左右两条路都看得清。","place":"avenue","object":"lantern","actionLabel":"点亮路口","foundText":"灯没有只照一边。你为梦留下一处明亮的路口，等走路的人自己决定方向。"},{"id":"diaochan-step3","title":"为散场松结","clue":"城西驿舍存着一条舞台系带。把结松开一些，给散场后的片刻留一点余地。","place":"inn","object":"ribbon","actionLabel":"松开系带","foundText":"系带松开后，帷幕可以缓缓落下。这场梦留给她的，不只有开场时的掌声。"}]},"conversation":{"prompt":"貂蝉合起素扇：待故事的帷幕落下之后，你愿怎样陪我？","choices":[{"id":"listen","label":"听你说台词之外的话","response":"“那么，先别叫下一个角色上场。”她坐到灯旁，“今夜，我想慢慢说一句自己的话。”","endingTitle":"台词之外","endingText":"你让未说完的话停在灯前，没有用下一场戏把它盖过。小说人物在这一夜的相遇里，获得一段无需表演的时间。"},{"id":"ask","label":"若由你布置舞台，灯放哪里？","response":"“放在门边，也放在座旁。”她指了指两处，“让要走的人看清路，让要留的人坐得安稳。”","endingTitle":"门与座旁","endingText":"你依她的意思挪动小灯。帷幕前后都亮起来，一处照路，一处照座，故事不必催着所有人走向同一个出口。"},{"id":"help","label":"我收好帷幕，你歇一会儿","response":"“别把它收得太紧，明夜还可以换个布景。”她笑着放下扇，“今夜先让我歇一歇。”","endingTitle":"散场未催","endingText":"你把系带放松，收好小灯。庭里没有催场声，只有一张可以安坐的椅子，与明夜仍可重新布置的舞台。"}]},"vignette":{"title":"知音 · 帷幕后仍有灯","lines":["貂蝉把扇放在膝上：“你连散场后的灯也留好了，这倒是一场难得的戏。”","“今夜不必再添计谋。让我坐在这里，看一会儿没有催场声的月亮。”","她轻轻拨开帷幕：“故事里的人暂且歇下，灯下的人，还可以继续说话。”"],"closing":"帷幕没有遮住月色，空庭留着一处温暖的座位。"}}},"yang-yuhuan":{"name":"杨玉环","greeting":"宫灯正暖，先听一拍，再说一句话吧。我愿与你谈音律，也愿把那些过于响亮的传说放轻些。","questions":[{"id":"yang-yuhuan-q1","prompt":"客人，两部唐书把我写在哪一代宫廷的叙事中？","options":["西汉元帝","唐玄宗","东汉献帝"],"answer":1,"reply":"《旧唐书·后妃传》记玄宗杨贵妃。她属于唐代宫廷叙事，不能与西施、昭君当作真实的同时代友人。","sourceLabel":"《旧唐书》卷五十一 · 杨贵妃","sourceUrl":"https://zh.wikisource.org/wiki/舊唐書/卷51#楊貴妃"},{"id":"yang-yuhuan-q2","prompt":"若不只谈容貌，史书明确写过我的哪一项才能？","options":["善歌舞，通音律","撰写《三国演义》","参加边塞骑射"],"answer":0,"reply":"《旧唐书》记杨贵妃善歌舞、通音律；《新唐书》也记其歌舞与音律才能。才艺是她的人物介绍中可据文本呈现的部分。","sourceLabel":"《旧唐书》卷五十一 · 杨贵妃","sourceUrl":"https://zh.wikisource.org/wiki/舊唐書/卷51#楊貴妃"},{"id":"yang-yuhuan-q3","prompt":"入道时，史书写我的名号是什么？","options":["宁胡","闭月","太真"],"answer":2,"reply":"两部唐书均提到太真之号。宁胡与昭君相关，闭月则是后世文艺称谓，不能当作杨贵妃的道号。","sourceLabel":"《新唐书》卷七十六 · 玄宗贵妃杨氏","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷076#玄宗貴妃楊氏"},{"id":"yang-yuhuan-q4","prompt":"《新唐书》写在成为贵妃之前，我曾是什么身份？","options":["王允府中歌伎","寿王妃","越国献吴之女"],"answer":1,"reply":"《新唐书》写杨氏最初为寿王妃，随后叙述入道与受玄宗宠遇的过程。不同阶段不宜被压成一个身份。","sourceLabel":"《新唐书》卷七十六 · 玄宗贵妃杨氏","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷076#玄宗貴妃楊氏"},{"id":"yang-yuhuan-q5","prompt":"若循史书而不是仙山传奇，我人生末段发生在何处？","options":["苎萝山","匈奴王庭","马嵬"],"answer":2,"reply":"《旧唐书》记随驾西行至马嵬，杨贵妃死于兵变中的逼迫。诗歌与传奇的重会想象，不能代替史书结局。","sourceLabel":"《旧唐书》卷五十一 · 杨贵妃","sourceUrl":"https://zh.wikisource.org/wiki/舊唐書/卷51#楊貴妃"},{"id":"yang-yuhuan-q6","prompt":"两部唐书的“丰艳”等文字，能替今日画像确定什么？","options":["可作气质参考，面容仍须想象","确切身高和体重","可复原的五官尺寸"],"answer":0,"reply":"《旧唐书》的外貌文字很简短，没有五官尺寸与准确体重。作品可以借此取意，却不能把原创画像称为本人面容复原。","sourceLabel":"《旧唐书》卷五十一 · 杨贵妃","sourceUrl":"https://zh.wikisource.org/wiki/舊唐書/卷51#楊貴妃"}],"rewards":[{"threshold":10,"title":"灯下试拍","text":"杨玉环轻敲桌沿，第一声很轻，第二声才跟上灯影。你以为要立刻听见华丽的乐曲，她却示意先把这一拍听完整。窗外有人走过，鞋履声恰好落在两拍之间。“热闹也有自己的空隙。”她笑着让你再敲一次。你没有敲准，她也没有收回手，只将速度放缓；宫灯里的这一小段相会，终于有了两个人都能跟上的节奏。","basis":"原创梦中小记。史书所记歌舞音律才能为依据；敲桌教学、言语与相会为艺术想象。","sourceLabel":"《旧唐书》卷五十一 · 杨贵妃","sourceUrl":"https://zh.wikisource.org/wiki/舊唐書/卷51#楊貴妃"},{"threshold":30,"title":"舞歇闻风","text":"一段舞结束后，她没有急着再转身，只把披帛搭在椅背上。你问下一段要用多快的节拍，她却请你打开半扇窗。风穿过庭树，叶子先响，枝条后动，谁都不必抢在前面。杨玉环听着那不整齐的声响，轻轻点头：“有时，停下来也是听。”这一回你们没有续上鼓声，让月色慢慢越过窗槛，给灯下的身影留出一小段休息。","basis":"原创梦中小记。音律才能见两部唐书；披帛、舞后休息与自然节奏的谈话是情境创作。","sourceLabel":"《新唐书》卷七十六 · 玄宗贵妃杨氏","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷076#玄宗貴妃楊氏"},{"threshold":60,"title":"一曲不问盛衰","text":"夜已深，灯下只剩一张空白曲笺。你没有请她重演盛世，也没有将一场乱世压成一句责问。杨玉环在纸角点下第一记拍子，让你接上第二记：“这一回，只把听见的写下来。”你写灯芯轻响，写窗外风声，也写一段尚未成曲的停顿。那页纸没有替任何人的一生作判词，却使才艺在宏大的叙事之外，留下可被认真倾听的声音。","basis":"原创梦中小记。以史书记载的音律才情为起点；此曲笺与对话属虚构，不将个人才艺等同于军政责任。","sourceLabel":"《旧唐书》卷五十一 · 杨贵妃","sourceUrl":"https://zh.wikisource.org/wiki/舊唐書/卷51#楊貴妃"}],"journey":{"quest":{"title":"为月下小曲备场","intro":"这是一场以音律才情为起点的原创宫灯梦。杨玉环请你借长安街声备一场小小相会：取曲笺、理舞带、安暖灯，让每个人都能从容听完。","steps":[{"id":"yang-yuhuan-step1","title":"长街拾拍","clue":"朱雀长街有一张待续的曲笺。先听脚步与灯市声，给第一拍留一点空隙。","place":"avenue","object":"score","actionLabel":"拾回曲笺","foundText":"曲笺上只有零星拍点。你没有把空处填满，让街声与停顿也能被听见。"},{"id":"yang-yuhuan-step2","title":"巷灯理带","clue":"坊巷灯影旁留着一段舞带。顺着布纹理好，不必打一个过紧的结。","place":"alley","object":"ribbon","actionLabel":"理好舞带","foundText":"你顺平舞带，让它可以随转身舒展。布纹映着暖光，像未起的旋律先轻轻呼吸。"},{"id":"yang-yuhuan-step3","title":"城门安暖灯","clue":"明德门内有一盏暖灯。替梦收好这点亮，把光放到能看清同伴的位置。","place":"gate","object":"lantern","actionLabel":"安好暖灯","foundText":"灯火落低了一些，不再刺眼。梦中的小曲已有曲笺、舞带，也有了能彼此看见的光。"}]},"conversation":{"prompt":"杨玉环在空白曲笺上轻点一拍：待灯与舞带备齐，今夜，你想怎样听这一曲？","choices":[{"id":"listen","label":"把曲中的停顿也听完","response":"“那就别急着续上鼓声。”她停住指尖，“一拍之后的安静，有时也需要一个听众。”","endingTitle":"留白成拍","endingText":"你们把曲笺上的空处留下。小曲没有急着铺满整夜，灯芯的轻响，也在两拍之间找到自己的位置。"},{"id":"ask","label":"怎样让大家都跟上这一拍？","response":"“先慢一点，听见身旁的人。”她把曲笺推近，“好听并不总是繁复，也可以是无人被落下。”","endingTitle":"同拍相会","endingText":"你试着接上第二拍，她等你听稳再续。小曲并不炫耀技巧，却使同一盏灯下的人，都有从容加入的余地。"},{"id":"help","label":"我摆好灯与座，请你先歇息","response":"“那我也听你准备的声音。”她将舞带搭好，“灯市的脚步、晚风，都可以是今夜的开场。”","endingTitle":"先听晚风","endingText":"舞带先搭在椅背，灯照着空出的座位。你们听完一阵晚风，才从容翻开曲笺，让备场本身也成为相会。"}]},"vignette":{"title":"知音 · 灯下同一拍","lines":["杨玉环展平曲笺：“你把空处留下了。这样，我才听得到灯旁还有谁。”","“来，先接这一拍。快了也无妨，我们慢一点，总能一起听稳。”","她将暖灯转向你：“今夜的好曲，不在繁声里，就在你肯接上的这一拍。”"],"closing":"曲笺轻轻合拢，灯下的余韵留给两个人。"}}},"li-bai":{"name":"李白","greeting":"来得好！给你留一张凳子。且把赶路的心放下，我们借这轮月说几句话。","questions":[{"id":"li-bai-q1","prompt":"先认个名字吧：我的字是什么？","options":["子美","太白","摩诘"],"answer":1,"reply":"正是太白。《新唐书》李白传开篇记下这个字，别把我与杜甫、王维认混啦。","sourceLabel":"《新唐书》卷202·李白传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#李白"},{"id":"li-bai-q2","prompt":"《月下独酌》里，陪诗人凑成“三人”的是谁？","options":["明月与自己的影子","两位同行的友人","掌柜与卖酒的人"],"answer":0,"reply":"是月与影，加上诗中的我，便成三人。这是诗的想象，让独酌也有了相伴的情趣。","sourceLabel":"李白《月下独酌四首·其一》","sourceUrl":"https://zh.wikisource.org/wiki/月下獨酌_(花間一壺酒)"},{"id":"li-bai-q3","prompt":"人物梦卷里写长安酒家、形容我才思奔涌的诗，出自谁的笔下？","options":["王维","白居易","杜甫"],"answer":2,"reply":"是杜甫的《饮中八仙歌》。他写得痛快；其中的饮酒与作诗数量，应读作文学夸张。","sourceLabel":"杜甫《饮中八仙歌》","sourceUrl":"https://zh.wikisource.org/wiki/飲中八仙歌"},{"id":"li-bai-q4","prompt":"《新唐书》记我在天宝初来到长安，得到哪项任用？","options":["供奉翰林","担任长安城门守将","出任太乐丞"],"answer":0,"reply":"史传记的是供奉翰林。这能说明我与朝廷的联系，却不能替这座虚构酒肆找出真实门牌。","sourceLabel":"《新唐书》卷202·李白传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#李白"},{"id":"li-bai-q5","prompt":"《月下独酌》里，诗人对月和影的关系写得怎样？","options":["月与影是真实来访的朋友","月不懂饮酒，影随人而动","月教他弹琴，影替他写字"],"answer":1,"reply":"诗中知道月不解饮、影随自身。想象中的热闹与现实里的独处，恰好在这里相遇。","sourceLabel":"李白《月下独酌四首·其一》","sourceUrl":"https://zh.wikisource.org/wiki/月下獨酌_(花間一壺酒)"},{"id":"li-bai-q6","prompt":"《月下独酌》的结尾，诗人把再次相会的愿望寄向哪里？","options":["明日的朝堂","城门的集市","遥远的云汉"],"answer":2,"reply":"是遥远的云汉。诗末将相会的愿望写向天上，让眼前的月与影，继续陪伴想象中的远游。","sourceLabel":"李白《月下独酌四首·其一》","sourceUrl":"https://zh.wikisource.org/wiki/月下獨酌_(花間一壺酒)"}],"rewards":[{"threshold":10,"title":"月边添一席","text":"李白把空凳推到月光里，笑说今夜的影子终于不必独占一席。你在酒案旁坐下，远处的车声渐渐沉入城门。他没有催你吟诗，只递来一张干净的纸，让你写下路上看见的一件小事。你写了一盏歪斜的灯，他便提笔画一道风，说能记住这样的光，已经是会看夜色的人了。","basis":"邀月与对影的线索来自《月下独酌》；邀坐、纸笔和全部对白为原创虚构。","sourceLabel":"李白《月下独酌四首·其一》","sourceUrl":"https://zh.wikisource.org/wiki/月下獨酌_(花間一壺酒)"},{"threshold":30,"title":"未写完的远游","text":"他摊开一张没有地名的纸，墨线从城楼一直伸向留白处。你问那条路通向哪里，他说不必今晚就知道。灯芯轻响，他忽然把笔停住，给远山留下一片空白。你们谈了很久的行路，却没有订下启程的日子；纸上只有两道并行的线，像此刻并肩坐着的人，也像尚未相见的河流。","basis":"李白离开长安后游历四方见于《新唐书》；无名地图与此夜谈话为原创虚构。","sourceLabel":"《新唐书》卷202·李白传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#李白"},{"threshold":60,"title":"留给故人的灯","text":"酒肆将歇，李白仍替你留着那张凳子。你说下回来的日子未定，他把桌上的纸折好交到你手中：上面没有豪语，只有你先前画歪的灯，被添了一小轮月。门外夜风吹动帘角，他陪你走到桥头才停步。你回望时，案边的灯还亮着，仿佛一句没有说完、却不必急着说完的话。","basis":"月与影的相伴意象来自诗歌；赠纸、送行和故人关系为原创虚构。","sourceLabel":"李白《月下独酌四首·其一》","sourceUrl":"https://zh.wikisource.org/wiki/月下獨酌_(花間一壺酒)"}],"journey":{"quest":{"title":"拾回三页月色","intro":"李白把空纸推到你面前：风带走了三张随手写的诗笺，烦你沿灯火找找。此行与纸上文字均为原创故事。","steps":[{"id":"li-bai-step1","title":"驿舍案边的诗笺","clue":"城西驿舍前有一页纸，被杯底压住了一角。先别惊动赶路的人。","place":"inn","object":"poem","actionLabel":"拾起案边诗笺","foundText":"你展平第一页，纸上只写着：有灯的地方，暂且算作归处。墨迹是这段故事里的原创句子。"},{"id":"li-bai-step2","title":"坊巷檐下的诗笺","clue":"转入坊巷，看看低檐旁的灯影。第二页被风卷起，正挂在灯架边。","place":"alley","object":"poem","actionLabel":"取下檐边诗笺","foundText":"第二页背面画了一弯月。你理平折角，发现留白比墨迹更多，像一条尚未走完的路。"},{"id":"li-bai-step3","title":"月桥岸边的诗笺","clue":"最后一页飘到了月桥岸边。它留在岸上的石旁，不必踏进溪水。","place":"bridgehead","object":"poem","actionLabel":"收好岸边诗笺","foundText":"三页终于齐了。末页有两个并排的小点，李白说一个留给月，一个留给今夜替他寻纸的人。"}]},"conversation":{"prompt":"李白把空纸铺在案边：若寻回三页，你想给这一夜添些什么？","choices":[{"id":"listen","label":"先听你慢慢说","response":"那便坐下。最远的路，也可以从今晚的一张凳子说起。","endingTitle":"月下听远游","endingText":"你没有急着落笔。李白把三页铺在案上，从一处空白谈到另一处；灯芯换过一次，月光仍替你们照着未写完的路。"},{"id":"ask","label":"问问留白是留给谁的","response":"留给还没到的人，也留给已经坐在眼前、却有话没说的人。","endingTitle":"留白有故人","endingText":"你在纸角添了一盏小灯。李白看了一会儿，没有补上地名，只把那盏灯朝你这边推了推；下回相见，便从这里接着写。"},{"id":"help","label":"替你把三页装成小册","response":"好！别装得太紧，给风留一道缝，也给新故事留一页纸。","endingTitle":"把夜装成册","endingText":"你用细线收好三页，另添一张空纸。李白在封面画了月，没有题名；他让你先保管，说册子既然经过你的手，也该记一段你的来路。"}]},"vignette":{"title":"月边又添一席","lines":["李白把寻回的小册翻到空页，案上的月光恰好落在两人之间。","“今夜不用作诗。”他把凳子往旁边让了让，“先说说你的远方。”","你坐下，他停笔听着；风翻过一页，没有谁急着把它按住。"],"closing":"知音片段已收入游记。月下共坐、对白与小册均为原创演绎。"}}},"wang-wei":{"name":"王维","greeting":"竹间还有一处空席。你若不急，我们便听一会儿风，再慢慢说。","questions":[{"id":"wang-wei-q1","prompt":"《竹里馆》所写的幽篁，指的是哪一种景物？","options":["幽深的竹林","结冰的池塘","高大的宫墙"],"answer":0,"reply":"是幽深的竹林。诗从独坐竹间写起；这里的亭形与灯色，是沿着这片诗意继续构想的。","sourceLabel":"王维《辋川集·竹里馆》","sourceUrl":"https://zh.wikisource.org/wiki/輞川集_(王維)/竹里館"},{"id":"wang-wei-q2","prompt":"除了弹琴，《竹里馆》还写了哪一种声音？","options":["军鼓催战","市井叫卖","长啸"],"answer":2,"reply":"还有长啸。琴声与人的声音都在诗中出现，幽静并不意味着四周全无声息。","sourceLabel":"王维《辋川集·竹里馆》","sourceUrl":"https://zh.wikisource.org/wiki/輞川集_(王維)/竹里館"},{"id":"wang-wei-q3","prompt":"诗的末尾，谁来到深林中相照？","options":["宫里的使者","明月","一队提灯的行人"],"answer":1,"reply":"是明月。诗中的相照不必化成真实来客；你可以把它读成独坐时的一份清明陪伴。","sourceLabel":"王维《辋川集·竹里馆》","sourceUrl":"https://zh.wikisource.org/wiki/輞川集_(王維)/竹里館"},{"id":"wang-wei-q4","prompt":"《新唐书》记载的别墅和竹里馆等景点，与哪一地名相关？","options":["辋川","大明宫","江南岐王宅"],"answer":0,"reply":"是辋川。史传列出竹里馆等景名；夜游长安借用这份诗境，不把辋川说成长安市内的坊巷。","sourceLabel":"《新唐书》卷202·王维传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#王維"},{"id":"wang-wei-q5","prompt":"史传记我在辋川与哪位诗人游赏、赋诗相酬？","options":["李龟年","公孙大娘","裴迪"],"answer":2,"reply":"是裴迪。《新唐书》记我们游于辋川、以诗相酬；这为朋友之间的诗意往来留下线索。","sourceLabel":"《新唐书》卷202·王维传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#王維"},{"id":"wang-wei-q6","prompt":"史传除了说我作诗，还特别记下哪项才能？","options":["统领水军","绘画，尤其山水","锻造舞剑"],"answer":1,"reply":"史传写我善画，并谈到山水、云势与石色。不过这里的画像与小亭，是今天创作者的想象。","sourceLabel":"《新唐书》卷202·王维传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#王維"}],"rewards":[{"threshold":10,"title":"听竹之前","text":"你刚想开口，王维抬手示意，竹梢恰在这时相触。他将琴上的手收回，让那一声细响自己走完。你们没有立即谈诗，而是数了几次风停与风起。待月光移过琴案，他才问你刚才听见了什么。你答得很轻，他也轻轻点头，把靠窗的空席往你这边让了一点。","basis":"竹林、弹琴与月色据《竹里馆》；听竹、让席及对白为原创虚构。","sourceLabel":"王维《辋川集·竹里馆》","sourceUrl":"https://zh.wikisource.org/wiki/輞川集_(王維)/竹里館"},{"threshold":30,"title":"一页未着色","text":"案上铺着一页尚未着色的山水，王维请你为它选一处留白。你指向两山之间，他没有补画楼阁，只添了一痕很淡的水。窗外竹影落上纸面，像另一只缓慢移动的笔。你们看着那页画，直到影子挪开；画上的空处仍在，仿佛给看画的人留下一条可以自己走进去的路。","basis":"山水画才能据《新唐书》；这幅画、留白选择与同看竹影的情节为原创虚构。","sourceLabel":"《新唐书》卷202·王维传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#王維"},{"threshold":60,"title":"不必作答的夜","text":"这次你带来的，是一件难以说清的心事。王维没有替你断言，只将琴拨出一个短音，然后留它慢慢散去。你们坐到灯芯将尽，桌上那页山水仍未填满。离开时，他把空白纸页留给你：下回不必先写好答案，带着没有想明白的事，也可以来坐一会儿。竹间的席位始终空着。","basis":"幽林与琴声的线索来自《竹里馆》；倾听心事、赠纸和友情为原创虚构。","sourceLabel":"王维《辋川集·竹里馆》","sourceUrl":"https://zh.wikisource.org/wiki/輞川集_(王維)/竹里館"}],"journey":{"quest":{"title":"带回三处夜声","intro":"王维想画一页夜色，请你记住水、风和停步时的声音。不必采折草木，带回听见的片刻便好；情节为原创演绎。","steps":[{"id":"wang-wei-step1","title":"月桥听水","clue":"到月桥岸边，找一枚搁在岸上的小石。让手停一会儿，听水从桥影下过去。","place":"bridgehead","object":"stone","actionLabel":"停步听一会儿水","foundText":"你没有把石投入溪中。水声绕过岸边，远近不齐；这一声流水，被你记在了心里。"},{"id":"wang-wei-step2","title":"坊巷候风","clue":"坊巷低檐下挂着一枚竹制风铃。它静着时，也不必伸手催它。","place":"alley","object":"chime","actionLabel":"等风铃轻响","foundText":"风铃响过一声，你仍留了一会儿。声音散去以后，檐下的静也有了轮廓。"},{"id":"wang-wei-step3","title":"城门留一处静","clue":"回到明德门内的灯旁。人声与脚步都还在，试着只看灯影缓缓挪动。","place":"gate","object":"lantern","actionLabel":"望灯片刻","foundText":"你在热闹里停住，没有要求四周安静。三处夜声带回来了，最后一处，是自己肯慢下来的时候。"}]},"conversation":{"prompt":"王维将画纸留了一半空白：水声、风声和城里的片刻，你愿与我先听哪一处？","choices":[{"id":"listen","label":"再一起静坐一会儿","response":"好。刚才那一声不必追，让下一阵风自己来。","endingTitle":"等风自己来","endingText":"你们先没有动笔，听琴音散进竹影。等到案上灯影移动，王维才添了一道淡墨；空着的地方，留住了共同等待的片刻。"},{"id":"ask","label":"问问热闹里也能有静吗","response":"人声未必碍着月色。你肯停一停，眼前便多了一处可看的地方。","endingTitle":"市声也入画","endingText":"你说起城门下的脚步，王维在远处点了几盏灯，没有抹去人家。夜色因此添了一点暖意；这页画里，静与热闹各有位置。"},{"id":"help","label":"替画纸选一处留白","response":"就按你听见的样子选吧。纸上不必把每件事都说尽。","endingTitle":"留白给流水","endingText":"你指向画纸中间，给溪水留出一条窄路。王维顺着你的手添上两笔竹影；你们没有填满空处，却都认得那一夜的风。"}]},"vignette":{"title":"此刻不必作答","lines":["王维收起画笔，让案上的一片留白朝着你；竹影缓缓移过纸面。","“带回来的三声，已经够了。”他轻拨一弦，等那点余音自己散去。","你们又坐了一会儿。月色落在空席上，像替下次相见留好了位置。"],"closing":"知音片段已收入游记。此处竹林、同坐与全部对白为原创诗境。"}}},"gongsun-daniang":{"name":"公孙大娘","greeting":"先站稳，再看剑光。舞台边给你留了位置；看完这一转，我们再谈。","questions":[{"id":"gongsun-daniang-q1","prompt":"留下我与弟子舞艺线索的《观公孙大娘弟子舞剑器行并序》，是谁写的？","options":["李白","王维","杜甫"],"answer":2,"reply":"是杜甫。诗与序既记见舞的经历，也借舞艺回望往日，不只是一份动作记录。","sourceLabel":"杜甫《观公孙大娘弟子舞剑器行并序》","sourceUrl":"https://zh.wikisource.org/wiki/觀公孫大娘弟子舞劍器行並序"},{"id":"gongsun-daniang-q2","prompt":"杜甫在诗序中回忆，童年曾在哪里看公孙氏舞剑器？","options":["郾城","长安酒肆","辋川竹林"],"answer":0,"reply":"诗序记的是郾城。这座灯下舞台是梦卷创作，不能据它把那次见舞改到长安。","sourceLabel":"杜甫《观公孙大娘弟子舞剑器行并序》·序","sourceUrl":"https://zh.wikisource.org/wiki/觀公孫大娘弟子舞劍器行並序"},{"id":"gongsun-daniang-q3","prompt":"诗序里，后来在夔府自称我弟子的舞者是谁？","options":["杨玉环","李十二娘","王昭君"],"answer":1,"reply":"是李十二娘。杜甫由弟子的舞追忆公孙氏，师承便这样穿过岁月，留在文字中。","sourceLabel":"杜甫《观公孙大娘弟子舞剑器行并序》·序","sourceUrl":"https://zh.wikisource.org/wiki/觀公孫大娘弟子舞劍器行並序"},{"id":"gongsun-daniang-q4","prompt":"古籍把观看公孙剑器舞与张旭哪门艺术的进益联系起来？","options":["草书","山水画","弹琴"],"answer":0,"reply":"是草书。杜甫诗序与《新唐书》都留下这条联系：舞的动势可以启发笔下的气韵。","sourceLabel":"《新唐书》卷202·张旭传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#附_張旭"},{"id":"gongsun-daniang-q5","prompt":"杜甫用雷霆写舞势，又用什么来比喻舞罢的凝定？","options":["市上灯火","满园落花","江海凝着的青光"],"answer":2,"reply":"是江海凝青光。诗把奔涌与收束写在一起；收住身形，也是舞的力量。","sourceLabel":"杜甫《观公孙大娘弟子舞剑器行并序》","sourceUrl":"https://zh.wikisource.org/wiki/觀公孫大娘弟子舞劍器行並序"},{"id":"gongsun-daniang-q6","prompt":"杜甫写舞势矫健腾起时，借哪种想象来作比？","options":["春燕绕竹","群帝乘龙飞翔","孤舟顺水而下"],"answer":1,"reply":"他借群帝乘龙飞翔作比。把一转舞势写到天际，便能让读诗的人也感到那份腾起的力量。","sourceLabel":"杜甫《观公孙大娘弟子舞剑器行并序》","sourceUrl":"https://zh.wikisource.org/wiki/觀公孫大娘弟子舞劍器行並序"}],"rewards":[{"threshold":10,"title":"剑光停处","text":"舞罢，你先为最亮的一转喝彩，公孙大娘却请你看她停下的脚步。她缓缓抬袖，再将身体收回原处，衣角仍在风中晃。你这才发现，灯下那一瞬的安静也有分量。她让你在台边划定一块站稳的位置，说下回看舞，不妨从舞势未起的时候开始，连最轻的换步也别错过。","basis":"起势与凝定的对照受杜甫诗中雷霆、江海意象启发；演示和对白为原创虚构。","sourceLabel":"杜甫《观公孙大娘弟子舞剑器行并序》","sourceUrl":"https://zh.wikisource.org/wiki/觀公孫大娘弟子舞劍器行並序"},{"threshold":30,"title":"把风交给纸","text":"你带来纸笔，想记住刚才的转身，落笔却总追不上袖影。公孙大娘便放慢身形，让你先画一条从起到止的线。她说线条可以弯，心里的节奏不能散。纸上的墨终于有了一次清楚的收束，你们都笑了。台边有人重新点灯，剑光掠过纸角，舞的余韵像从另一门手艺中醒来。","basis":"舞艺启发书法的文献线索见《新唐书》张旭传；你学画动势的场面为原创虚构。","sourceLabel":"《新唐书》卷202·张旭传","sourceUrl":"https://zh.wikisource.org/wiki/新唐書/卷202#附_張旭"},{"threshold":60,"title":"灯下留步","text":"观众散去，你仍站在最初划定的位置。公孙大娘看见你，便把最后一段练习留给空台：不为掌声，只让每一步走得完整。灯灭了一盏，另一盏还亮着。临别她问，下回来时，你愿不愿替她记住那次停顿。你点头，把那页有些歪斜的墨线收好；它已经不只是一次看舞的笔记。","basis":"舞艺传承的线索来自杜甫诗序；散场练习、约定与纪念纸页为原创虚构。","sourceLabel":"杜甫《观公孙大娘弟子舞剑器行并序》·序","sourceUrl":"https://zh.wikisource.org/wiki/觀公孫大娘弟子舞劍器行並序"}],"journey":{"quest":{"title":"为今夜留一方舞台","intro":"公孙大娘邀你帮忙备一场小小的灯下舞：稳灯、理袖，再定好起势的位置。准备过程与表演安排均为原创构想。","steps":[{"id":"gongsun-daniang-step1","title":"城门下稳住灯火","clue":"先到明德门内的灯架边，看看灯纸与挂绳。风一来，光也不能晃得太急。","place":"gate","object":"lantern","actionLabel":"扶正灯架","foundText":"你扶正灯架，理顺挂绳。暖光落稳，剑光转过时便有一处清楚的停顿。"},{"id":"gongsun-daniang-step2","title":"坊巷理好舞带","clue":"坊巷灯下备着一段舞带。只需抚平折痕、收好尾端，别让它缠住下一步。","place":"alley","object":"ribbon","actionLabel":"理顺舞带","foundText":"你解开松结，把舞带折成一束。公孙大娘接过后轻轻抖开，衣袖与风终于各走各的路。"},{"id":"gongsun-daniang-step3","title":"长街定住起势","clue":"朱雀长街旁有一枚压着起势记号的小石。认好这一处，替她看住灯下的空位。","place":"avenue","object":"stone","actionLabel":"确认起势位置","foundText":"灯与舞带都备好了，你又确认了落脚的位置。公孙大娘收袖站定，今夜的第一步有了去处。"}]},"conversation":{"prompt":"公孙大娘站到灯下，先没有起舞：待这一方光备好，开场之前，你还想看什么？","choices":[{"id":"listen","label":"看你从停步开始","response":"看仔细。这一息站得稳，下一转才有地方回来。","endingTitle":"一息站稳","endingText":"你守在台边，没有催第一声鼓。公孙大娘缓缓收肩、定步，再让袖影展开；你记住的，是剑光亮起以前那一瞬安静。"},{"id":"ask","label":"问问如何记住一场舞","response":"不必追住每一剑。挑一处你心里有回声的起落，带它回去。","endingTitle":"记住一次起落","endingText":"舞势转过，你在纸上画了一条并不整齐的线。公孙大娘看见收笔处，点头说你没有漏掉那次停顿；这一页足以留下今夜。"},{"id":"help","label":"替你守住灯与空位","response":"那就劳你站在这里。灯稳住了，我便放心把这一转交给风。","endingTitle":"守灯的人","endingText":"你守着理好的灯绳与台边空位，等最后一转收住才放手。散场时，公孙大娘朝这边看了一眼；那次谢幕，也留给了帮她稳住灯的人。"}]},"vignette":{"title":"谢幕仍有一人","lines":["灯架仍稳，舞带轻垂。公孙大娘站回起势处，这次先向你点头。","“这一段，给记得我怎样停步的人。”她转身收袖，剑光在暖灯前划过。","余势缓缓收住，她再次望向台边。没有催促的掌声，只有你还在。"],"closing":"知音片段已收入游记。动作与谢幕为原创演绎，不声称复原唐代舞谱。"}}},"li-guinian":{"name":"李龟年","greeting":"水边风轻，适合听曲。你愿坐下么？一曲之前，也可以先说说来路。","questions":[{"id":"li-guinian-q1","prompt":"《明皇杂录》记李龟年在开元年间以哪项技艺见长？","options":["歌唱","草书","剑器舞"],"answer":0,"reply":"笔记记我能歌。读这些文字，要记得它是唐人笔记中的叙述，不是留下来的录音。","sourceLabel":"郑处诲《明皇杂录》卷下·李龟年","sourceUrl":"https://zh.wikisource.org/wiki/明皇雜錄_(四庫全書本)/卷下"},{"id":"li-guinian-q2","prompt":"《江南逢李龟年》的作者是谁？","options":["王维","杜甫","李白"],"answer":1,"reply":"是杜甫。他从旧日听歌写到后来的相逢，短短一首诗，容下了很长的岁月。","sourceLabel":"杜甫《江南逢李龟年》","sourceUrl":"https://zh.wikisource.org/wiki/江南逢李龜年"},{"id":"li-guinian-q3","prompt":"这首诗的题目与末联，将重逢写在哪一片地方？","options":["长安城门","郾城舞台","江南"],"answer":2,"reply":"是在江南。梦卷借这份重逢的诗意来到夜游世界，并不把原诗改写为长安的现场。","sourceLabel":"杜甫《江南逢李龟年》","sourceUrl":"https://zh.wikisource.org/wiki/江南逢李龜年"},{"id":"li-guinian-q4","prompt":"诗的前半首回忆在哪两处宅第见面、听歌？","options":["岐王宅与崔九堂前","竹里馆与辋川别墅","长安酒肆与边塞驿站"],"answer":0,"reply":"是岐王宅与崔九堂前。这些旧日地名与江南相逢相接，让歌声带上了回忆。","sourceLabel":"杜甫《江南逢李龟年》","sourceUrl":"https://zh.wikisource.org/wiki/江南逢李龜年"},{"id":"li-guinian-q5","prompt":"诗中重逢时，用哪一种时节景象作结？","options":["漫天风雪","落花","秋雁南飞"],"answer":1,"reply":"是落花时节。你可以从中读到好风景里的身世感慨；诗并没有写出这次相逢的每一句对话。","sourceLabel":"杜甫《江南逢李龟年》","sourceUrl":"https://zh.wikisource.org/wiki/江南逢李龜年"},{"id":"li-guinian-q6","prompt":"《明皇杂录》记下的李氏兄弟中，哪一位善舞？","options":["杜甫","李鹤年","李彭年"],"answer":2,"reply":"记的是李彭年善舞，李鹤年与李龟年能歌。一家兄弟各展所长，笔记也为他们留下了名字。","sourceLabel":"郑处诲《明皇杂录》卷下·李氏兄弟","sourceUrl":"https://zh.wikisource.org/wiki/明皇雜錄_(四庫全書本)/卷下"}],"rewards":[{"threshold":10,"title":"一曲以前","text":"李龟年先问你走过了哪些灯火，听见你说桥上的风，他便把今晚的起音放得更轻。水面有一片落叶转了两圈，你们等它离开桥影，才让曲声慢慢升起。歌声停住时，他没有立刻问你好不好听，只看你是否还望着河面。你说那片叶子已经走远，他便笑了，像听见一句合意的回声。","basis":"歌者身份据《明皇杂录》；问路、河面落叶及这一曲的情节为原创虚构。","sourceLabel":"郑处诲《明皇杂录》卷下·李龟年","sourceUrl":"https://zh.wikisource.org/wiki/明皇雜錄_(四庫全書本)/卷下"},{"threshold":30,"title":"远处有人听见","text":"你问他，歌声传过水面以后，会不会变成另一支曲子。他没有急着回答，先让你在桥这头轻敲栏杆，自己走到对岸听。你敲的三下，被风错开了距离，却仍有人认得。回来时他把灯提得很低，说声音走远了，总会带上一点沿途的夜色；能被故人认出，便已经是一件暖事。","basis":"旧日听歌与后来相逢的线索来自杜甫诗；隔岸试声、提灯与对白为原创虚构。","sourceLabel":"杜甫《江南逢李龟年》","sourceUrl":"https://zh.wikisource.org/wiki/江南逢李龜年"},{"threshold":60,"title":"认得归人的曲","text":"你再来时，李龟年没有重新问姓名。他把曲子的开头停在那三个你曾敲过的节拍上，让你自己接下去。你敲得并不整齐，他却点头，说已经认得。夜深后，你们各自沿河而行；他在转弯处轻轻重复那段节奏。你没有回头，只用脚步回应，仿佛长路之间终于多了一种相认的办法。","basis":"重逢故人的情感线索来自《江南逢李龟年》；专属节拍、再次到访和友情为原创虚构。","sourceLabel":"杜甫《江南逢李龟年》","sourceUrl":"https://zh.wikisource.org/wiki/江南逢李龜年"}],"journey":{"quest":{"title":"替一段旋律找到回声","intro":"李龟年想为这一夜写段短曲，请你收好三处节拍的记号。曲子、记号与此行均为原创，不是传世唐乐的复原。","steps":[{"id":"li-guinian-step1","title":"驿舍拾起起音","clue":"城西驿舍案边放着一张旋律草记。纸角画了两盏灯，像曲子的两个起音。","place":"inn","object":"score","actionLabel":"收好旋律草记","foundText":"你认住两个简单的记号，没有急着把整页唱出来。李龟年说，今夜的开头先留得轻一点。"},{"id":"li-guinian-step2","title":"长街听见间歇","clue":"到朱雀长街旁的风铃边。留心响声之间的空处，曲子还少这一点呼吸。","place":"avenue","object":"chime","actionLabel":"记住两声之间","foundText":"风铃响了，又停了一会儿。你在草记中间留下一格空白，旋律因此有了可以喘息的地方。"},{"id":"li-guinian-step3","title":"月桥留下尾音","clue":"月桥岸边还留着末页草记。面对水面，把最后一声的去处记在纸角即可。","place":"bridgehead","object":"score","actionLabel":"补上末页记号","foundText":"起音、间歇与尾音接在一起。你画一道细细的水纹，李龟年便让最后一声停在它之前；曲已收住，水仍向前。"}]},"conversation":{"prompt":"李龟年将待续的草记放在灯下：若你愿陪我拾起旧曲，最后一声散去后，你想留下什么？","choices":[{"id":"listen","label":"听完再陪你坐一会儿","response":"那我便不急着续下一曲。有人听到曲尽，也有人肯留下，这就很好。","endingTitle":"曲尽灯还暖","endingText":"短曲结束，你仍坐在原处。李龟年没有接着唱，只把草记收好；远处灯影晃了一下，安静也成了这一夜共同留下的回声。"},{"id":"ask","label":"问问曲子该如何留住故人","response":"未必要记得每个音。下回听见开头，知道有人在等你，便够了。","endingTitle":"听见便认得","endingText":"你轻轻重复开头的两下节拍，李龟年跟着点头。你们约好下回不先报姓名，先接这一小段；夜路之间，便有了另一种相认。"},{"id":"help","label":"替你保存这张旋律草记","response":"请收好。纸若旧了也无妨，你肯再带它来，我就认得这一夜。","endingTitle":"纸旧曲未远","endingText":"你替草记折好纸角，将月桥上的水纹朝外。李龟年把末尾留得更轻；这段旋律从此有了一个可以随身带走、也可以带回的记号。"}]},"vignette":{"title":"这一声认得你","lines":["李龟年把草记铺在灯下。曲子还未开始，他先等你敲出那两下节拍。","“认得了。”他笑着轻点案边，让短曲从你留下的空白处慢慢接起。","尾音散进水面，他没有问好不好听；你们看着远灯，又坐了一会儿。"],"closing":"知音片段已收入游记。相认、对白与短曲为原创演绎，未复原历史原曲。"}}},"wei-zheng":{"name":"魏徵","scene":"palace","greeting":"廊下风大，把纸压稳。若想认识我，不必先赞一句敢谏；先辨书中所记，再说你自己看见了什么。","questions":[{"id":"wei-zheng-q1","prompt":"翻开《旧唐书》的魏徵传，哪一个是他的字？","options":["玄成","玄龄","遂良"],"answer":0,"reply":"本传开篇记魏徵字玄成。玄龄是房玄龄之名，遂良是褚遂良之名；三人不可混作同一位谏臣。","sourceLabel":"《旧唐书》卷七十一 · 魏徵传首段","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"},{"id":"wei-zheng-q2","prompt":"在入太宗朝之前，魏徵曾在谁的东宫任职？","options":["李世民的秦王府","李建成的东宫","李隆基的东宫"],"answer":1,"reply":"本传记魏徵曾任李建成的太子洗马，也曾劝建成应对秦王。他与李世民的关系有敌对的前史，不能只从后来君臣相得的一面倒写其一生。","sourceLabel":"《旧唐书》卷七十一 · 魏徵事李建成与任谏议大夫","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"},{"id":"wei-zheng-q3","prompt":"除了进谏，史书还记魏徵参与了哪项工作？","options":["编订《开元礼》","撰写《长恨歌》","校定四部图书，并参与前朝史书撰修"],"answer":2,"reply":"本传记他召集学者校定四部书，并参与《隋史》等史书的撰定与总论。直言之外，他也在整理材料、辨析旧事。","sourceLabel":"《旧唐书》卷七十一 · 秘书监校书及总加撰定诸史","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"},{"id":"wei-zheng-q4","prompt":"魏徵区分“良臣”与“忠臣”时，更希望达成怎样的结果？","options":["以进谏获罪身死作为唯一目标","君臣能共同成事，使国家与个人免于祸败","凡事先答应君主，退朝后再私下批评"],"answer":1,"reply":"传中这段区分着眼于实际结果：良臣与君主共同成事，忠臣则可能身遭诛戮而君国俱败。它不是要求读者把所有忠臣简单分成高下。","sourceLabel":"《旧唐书》卷七十一 · 良臣与忠臣之辨","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"},{"id":"wei-zheng-q5","prompt":"《贞观政要》记太宗问明暗之别，魏徵把关键放在哪里？","options":["只听最亲近的人","只看奏议的辞藻是否好听","听取不同方面的意见，防止偏信壅蔽"],"answer":2,"reply":"卷一将明暗之别系于兼听与偏信，强调使下情得以上达。兼听也需要辨析证据，不等于每个说法都照单全收。","sourceLabel":"《贞观政要》卷一 · 君道第一，贞观二年问答","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷01"},{"id":"wei-zheng-q6","prompt":"读完魏徵传末，怎样理解他与太宗的关系更合史料？","options":["有亲重与纳谏，也有魏徵身后遭疑、其子婚约被停的裂隙","从未出现猜疑与不悦","两人从未相见，所有往来都是后世小说"],"answer":0,"reply":"本传既记太宗哀悼魏徵，也记后来对其荐人与示史官之事生疑，并停其子婚约。君臣关系并非一幅始终无裂痕的图画；这里不额外添入传中没有展开的情节。","sourceLabel":"《旧唐书》卷七十一 · 魏徵身后遭疑及停婚","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"}],"rewards":[{"threshold":10,"title":"纸边的一行","text":"来客：你方才没有急着把两册合上，倒在纸边留了一个问号。我愿先记住这个。说话直，并不难装出模样；难的是一句话出口之后，仍肯让人问它从何而来。下次到廊下，不必备好赞语。带一件你亲眼所见的事，再带一处尚未弄清的地方，我们才有话可谈。若有不认同，也别因这张人物卡上写着我的名字，便把自己的疑问咽回去。","basis":"原创初识手札。借魏徵进谏、校书的史料线索写信任的开始；来客、纸页与全部言语均为本作创作，不是魏徵遗札。","sourceLabel":"《旧唐书》卷七十一 · 魏徵进谏与校书","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"},{"threshold":30,"title":"不必替我圆话","text":"来客：你问，既说兼听，遇到彼此抵牾的话又当如何。我也不能替每一件事先备一个稳妥答案。有人称许直言，便以为直言者处处不误；这称许若使人不再受问，仍会遮住耳目。你往后替我递话，莫删去其中可疑的一句，也莫把自己的判断藏成我的意思。纸上分清谁见、谁说、谁推断，比把文章修得整齐更费工夫，却值得费这一点工夫。","basis":"原创相知手札。议题取自兼听与辨析，不将信中自省或具体说法冒充史载言论。","sourceLabel":"《贞观政要》卷一 · 君道第一，兼听与偏信","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷01"},{"threshold":60,"title":"卷中留你的名字","text":"来客：如今我托你的，不是寻一句能使满殿点头的话。去看看雨损簿，再看看案上的奏议；若两处说得不同，就把不同留下。你可以具名立说，也可以先列待核之目，但要交代凭据与下一步。听一席话之后仍能保有自己的眼睛，才不枉这一程。到最后，请把我的名字也当作一个可以追问的名字；莫因相知，便免了彼此再核一遍的责任。","basis":"原创知音手札及个人托付引子。此处的雨损与卷册为宫阙虚构物证，不对应一次真实奏对；关系表示理解与信任。","sourceLabel":"《旧唐书》卷七十一 · 进谏、论公道与君臣关系","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"}],"journey":{"quest":{"title":"把异议留在卷中","intro":"魏徵另托你核一份随行摘记：哪些是眼见，哪些只是推断？走三站留下核对笔记，最后选择怎样将尚存的分歧附卷。这一托付独立于修缮奏议，不重写原卷选择。","steps":[{"id":"wei-zheng-step1","title":"雨簿分两栏","clue":"到议事廊的仓廊雨损簿前，分开“已见的损处”与“尚待核实的说法”。","place":"palace-west","object":"poem","target":"rain-report","actionLabel":"记下所见与待核","foundText":"你在随行笺上分出两栏：漏缝的位置可见，修补是否足够仍须核验。你没有改动雨损簿，只留下自己的核对记号。"},{"id":"wei-zheng-step2","title":"奏议寻省略","clue":"往两仪殿意象，查看未落印的奏议；核对雨簿里的细节，有什么在摘要中被略去了？","place":"palace-court","object":"score","target":"court-draft","actionLabel":"为摘要补一条旁记","foundText":"“修缮”二字太宽，遮住了漏顶与褪色的轻重。你在自己的摘记旁写明这一差别，并注明它来自哪一册；御案原卷没有被你替换。"},{"id":"wei-zheng-step3","title":"廊下受一问","clue":"带着两处核对回到议事廊，走近魏徵，请他质问你这份摘记。","place":"palace-west","object":"stone","target":"wei-zheng","actionLabel":"请他核这一句","foundText":"魏徵没有先判你赞成谁，只问：“此处的‘必然’，有何凭据？”你将它改作“仍待验明”。这次交谈里，你也可以不服他的判断，只须说明理由。"}]},"conversation":{"prompt":"魏徵把一页空白随行笺推给你：“待你核完三处，分歧或许仍在。你准备怎样留下这一页，使后来的人仍有从头核问的余地？”","choices":[{"id":"signed-record","label":"具名附议，逐项写出我据何立说","response":"“具名之后，更要容人来问。”他替你留出落款处。你的不同意见没有被改写成他的意见，也没有因他的身份而被删去。","endingTitle":"纸上有名，话中有据","endingText":"你在随行摘记中署名，把所见、推断与不同意见分开。结论未必从此无误，却有了一个愿意回应追问的人。这份个人结卷记下你的写法，不改动已完成的修缮奏议，也不替真实历史新增一次进谏。"},{"id":"open-inquiry","label":"保留分歧，列出待核事项与复问顺序","response":"“未定并非不可，莫让未定成了无人再问。”你在每一条疑处后写上下一步，先核损处，再对工数，最后回看原话。","endingTitle":"待核的一栏","endingText":"你没有替尚不明白的事勉强定论，而是留下可继续核对的清单。廊灯照见几处空格，每一处都标着追问的方向。这是你与魏徵之间的原创个人结卷，旧奏议的取舍仍照原样保存。"}]},"vignette":{"title":"廊下容一声不同","lines":["魏徵将一页无题的纸铺在廊案上，只道：“今夜先说一件你不认同的事。”","你指出摘记中仍可商榷的一句。他听到一半伸手欲辩，停了停，示意你把凭据说完。","风翻起纸角，他按住另一端：“若我只肯听赞同，这些夜话便都白费了。”"],"closing":"原创知音相约。此段为信任与讨论的想象，不是史载对话；相约可回看，不重复增加关系进度。"}}},"empress-zhangsun":{"name":"长孙皇后","scene":"palace","greeting":"先把书放平，不必忙着称贤。若一寸旧料值得留下，照料它的人也该在册中有一行。我们从书页里慢慢认人。","questions":[{"id":"empress-zhangsun-q1","prompt":"《旧唐书》这篇本传以何种称谓记述长孙皇后？","options":["以可靠记载的个人名“无垢”立传","以文德皇后长孙氏记述，并未在此记出个人名","以杨氏记述，为唐玄宗皇后"],"answer":1,"reply":"本传题为文德皇后长孙氏，未记其个人名。本作使用姓氏与皇后称谓，不把后世常见的虚构姓名写成已证实的史实。","sourceLabel":"《旧唐书》卷五十一 · 文德皇后长孙氏","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"},{"id":"empress-zhangsun-q2","prompt":"本传开篇记长孙氏年少时有怎样的习惯？","options":["喜好读书","撰写《长恨歌》","主持开凿大运河"],"answer":0,"reply":"本传记她年少好读书。书阁由此取意；阁的具体布局、藏书与今夜相见仍是作者布景，并非据史复原。","sourceLabel":"《旧唐书》卷五十一 · 文德皇后传首段","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"},{"id":"empress-zhangsun-q3","prompt":"史书记她编撰古代妇人事迹，结成了哪一部书？","options":["《女诫》七篇","《列女传》八卷","《女则》十卷"],"answer":2,"reply":"本传记《女则》十卷，由她作序。这里依据传记认识其著述活动；本作手札均为新创，不冒充《女则》原文或失传篇章。","sourceLabel":"《旧唐书》卷五十一 · 长孙皇后撰《女则》","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"},{"id":"empress-zhangsun-q4","prompt":"面对太宗重用长孙无忌，本传记她主要担忧什么？","options":["外戚因亲属关系集中掌权，带来长远祸患","亲属所得职位仍不够多","凡是亲属，无论能力如何都必须受罚"],"answer":0,"reply":"她反对兄弟子侄因后族身份布列权要，关注亲缘与权力纠缠的风险。这不是关于所有亲属能力的笼统结论。","sourceLabel":"《旧唐书》卷五十一 · 谏止外戚居权要","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"},{"id":"empress-zhangsun-q5","prompt":"她患病时，太子提出赦囚祈福，本传记她怎样回应？","options":["立即要求赦免所有罪囚","认为赦免关乎国家法度，不应只因自己的疾病而改动","要求由衣料册决定刑狱"],"answer":1,"reply":"本传记她反对为个人病情而轻动赦免等大事。此处所讨论的，是当时语境中个人愿望与公共法度的界限。","sourceLabel":"《旧唐书》卷五十一 · 九成宫患病与反对因病肆赦","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"},{"id":"empress-zhangsun-q6","prompt":"魏徵谏止长乐公主嫁资逾礼之后，本传怎样记她的反应？","options":["要求惩处魏徵","认为亲近之人便不该受约束","赞许其敢于进谏，也指出臣下面对君威的困难"],"answer":2,"reply":"传中她赞许进谏，也说亲近如夫妇，言语仍须顾虑君威。史书中的纳谏并不意味着没有权力压力；人物卡之外仍须读见这一层。","sourceLabel":"《旧唐书》卷五十一 · 长乐公主嫁资与称许魏徵进谏","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"}],"rewards":[{"threshold":10,"title":"素线不必藏","text":"来客：你在素衣前停得比在新册前久，倒使我想多问一句：看见补线时，你想到的是衣旧，还是有人肯把它补好？一件物能再用，靠的不只有“节省”二字，也有眼力、手艺与工夫。下次经过书阁，替我多看那些不显眼的地方。不要急着把它们写成贤德的凭证，先问它是否合用，谁为它花了心力，往后又交到谁的手上。","basis":"原创初识手札。节用议题取自长孙氏传记；素衣、补线、来客及信中全部言语为本作创作，不是宫廷实录。","sourceLabel":"《旧唐书》卷五十一 · 长孙皇后俭约记述","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"},{"threshold":30,"title":"册中该有谁","text":"来客：旧料册写得整齐，仍可能漏掉要紧的人。你说，若只在末尾记“省若干”，便看不见是谁多补了一夜。我把这句话另记了下来。惜物若变成催人无尽修补，也会叫好话失去分量。如今我们相谈，不必每件事都归到我的贤名之下。书里有书里的评语，眼前有眼前的劳苦；愿你既不轻弃一寸可用的料，也不轻省一人的工。","basis":"原创相知手札。由节用延伸出劳动与照料的作者议题，不据此断言长孙皇后实际主持过这份衣料账。","sourceLabel":"《旧唐书》卷五十一 · 长孙皇后传","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"},{"threshold":60,"title":"不借亲近作凭据","text":"来客：你已听过许多称许，也肯留下不合意的疑问。现有一件小托付：将素衣、料册与工簿相对照，替随行笺记清旧料之后还有怎样的工夫。最后怎样落笔，由你决定，不必猜我偏爱哪个答案。亲近不该使一笔账免于核问，信任也不能只凭一个名字。若这一页能让后来接手的人少猜一步，今夜的相知便有了一点着落。","basis":"原创知音手札。借传中亲缘与权力边界延展信任主题；虚构的衣料核对不改写历史制度或原修缮卷。","sourceLabel":"《旧唐书》卷五十一 · 长孙皇后谏止外戚居权要","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"}],"journey":{"quest":{"title":"一寸料，一人工","intro":"长孙皇后托你为旧物做一份随行小录：从补线看到用料，再从用料看到人的工夫。这里只核对和记述，不会凭空搬走素衣或改变宫中工役。","steps":[{"id":"empress-zhangsun-step1","title":"看见一道补线","clue":"到后苑书阁的素衣与补线前，留意修补后的牢固与原料的损耗。","place":"palace-garden","object":"ribbon","target":"plain-sleeve","actionLabel":"描记补线的位置","foundText":"你在随行笺上画出补线，写下“此处仍牢，余处待验”。衣料留在木架上，你带走的是一条观察，不是取下来的袖子。"},{"id":"empress-zhangsun-step2","title":"旧册问去向","clue":"转到书阁衣料旧册，对照刚才的补线，分清已知用途与尚缺的交接记载。","place":"palace-garden","object":"poem","target":"silk-book","actionLabel":"记下一处交接空白","foundText":"册上有“可补”二字，却没有替每一份余料写完去向。你在自己的小录留下待问处：谁验过，谁来补，交给谁用。你没有用想象补成已发生的事实。"},{"id":"empress-zhangsun-step3","title":"工簿见人","clue":"去议事廊的木料与工簿前，比较料数与工数，为旧物小录补上人的工夫。","place":"palace-west","object":"score","target":"work-ledger","actionLabel":"为省料另记工数","foundText":"工簿提醒你：旧料可用，也可能需要分拣与修补。你没有把木工和衣工混记，只为自己的小录补上一条原则：省了多少料，也应问添了多少工。"}]},"conversation":{"prompt":"长孙皇后取出一册空白小录：“去看看料，也看看人的工夫。核对三处之后，你愿让后来的人先记住什么？”","choices":[{"id":"count-the-work","label":"让省料与补工并记，照见修补者的工夫","response":"“若把人的工夫抹去，册上的俭约便会失实。”你将料数与所需工数分列，缺数之处照实留空，约待接手者核明。","endingTitle":"补线也有工数","endingText":"随行小录没有添一段颂辞，只为修补的人留下了一栏。此后读到“旧物再用”，你也会看见藏在这四字之后的时间与手艺。这份原创个人结卷保存你关注的方向，不改变修缮原卷或真实宫廷账目。"},{"id":"name-the-handover","label":"让验收与去向可追问，照见交接的责任","response":"“亲近的人来领，也须有交代。”你把验看、修补、领用分成几项，尚未知道的名字不乱填，只标出待核的人与事。","endingTitle":"一寸料，各有去处","endingText":"小录的末尾留下了交接顺序。它没有保证从此事事无误，却使一寸料的来去不再只凭一句“放心”。这是本作对理解与信任的原创落笔，不替长孙皇后增造一条史实。"}]},"vignette":{"title":"书阁里，一段从容","lines":["书阁的灯只照亮半张案。长孙皇后把小录翻到空白处，问你：“这次先不计多少，哪件小事值得留一行？”","你写下修补者收针后抚平衣料的动作。她没有替你润色，只将纸移近灯下，看了片刻。","“书中总有大名目，”她说，“若还有人肯看这些细处，便不必每一行都忙着教人。”"],"closing":"原创知音相约。书阁、动作和对话为艺术想象，非长孙皇后真实遗言或《女则》佚文；相约可回看，不重复计分。"}}},"li-shimin":{"name":"李世民","scene":"palace","greeting":"殿上可以落印，也可以遮住许多声音。若要认识我，莫只读顺耳的一页；功业、争夺与失误，都须容人记下。","questions":[{"id":"li-shimin-q1","prompt":"在即皇帝位之前，《旧唐书》记李世民的重要封号是哪一个？","options":["晋王","燕王","秦王"],"answer":2,"reply":"本纪记他受封秦王，后来即位为唐朝第二位皇帝，庙号太宗。秦王时期的军功与即位后的统治，应分别放回各自处境阅读。","sourceLabel":"《旧唐书》卷二 · 太宗本纪上，受封秦王与即位","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷2"},{"id":"li-shimin-q2","prompt":"阅读他即位前的经历，哪件事不能从人物志中略去？","options":["玄武门的武力夺权与李建成、李元吉之死","他与李建成和平轮流执政","他通过科举考中状元后被推举为帝"],"answer":0,"reply":"本纪记武德九年李世民率人在玄武门杀李建成、李元吉，随后被立为太子并即位。史书对此有立场与叙事安排；后来的功业不应遮去夺权中的暴力。","sourceLabel":"《旧唐书》卷二 · 武德九年六月至八月","sourceUrl":"https://zh.wikisource.org/zh-hans/舊唐書/卷2"},{"id":"li-shimin-q3","prompt":"《贞观政要》记太宗把良弓给弓工看，由此意识到了什么？","options":["会用弓便能完全懂得弓材","自己熟悉的事尚有不明，更应在政事上听人指正","工匠的意见不配进入讨论"],"answer":1,"reply":"弓工指出弓材纹理的问题，使太宗反思自己用弓虽多，仍未尽知其理。卷一借此引出询访外事与政教得失，不能把经验当作无所不知。","sourceLabel":"《贞观政要》卷一 · 政体第二，弓工论材","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷01"},{"id":"li-shimin-q4","prompt":"卷二记太宗劝臣下进谏时，对这些臣下自己又有什么要求？","options":["只能批评君主，不能接受别人批评","意见不同便可视作仇怨","也应接受他人的谏语，不因意见不同而护短"],"answer":2,"reply":"卷二记他要求臣下也能受人谏语。提出这种要求与始终做到仍是两回事；阅读人物时，应将政治表态和具体行为一并核对。","sourceLabel":"《贞观政要》卷二 · 求谏第四，贞观五年","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"},{"id":"li-shimin-q5","prompt":"谈到把切实议政的奏文载入史册，卷七记太宗提出了什么原则？","options":["只留下他曾采纳的意见","不论他当时采纳与否，都应记载有助于政理的切直议论","只保留辞藻最华美的颂赋"],"answer":1,"reply":"《论文史》篇记，对切直且有裨政理的上书，应连同未采纳的意见保存。这是书中的主张，不能据此断言存世史书已毫无遗漏或修饰。","sourceLabel":"《贞观政要》卷七 · 论文史第二十八，载录上书论事","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷07"},{"id":"li-shimin-q6","prompt":"太宗问起居注是否记自己的过失时，褚遂良怎样表明史官之职？","options":["君主言行善恶都要记，不能因是过失便不写","先等皇帝满意，再决定怎样写","只写日出日落，不记人的作为"],"answer":0,"reply":"卷七记褚遂良以载笔为职责，表示善恶都应记，并回应君主能否自观起居的要求。这段紧张关系提醒我们：记录者也需要不被权力随意改写的余地。","sourceLabel":"《贞观政要》卷七 · 论文史第二十八，贞观十三年起居问答","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷07"}],"rewards":[{"threshold":10,"title":"印不答问","text":"来客：你站在殿前，没有先问今夜要写什么颂辞。这样很好。一方印能使一页纸行远，却不能替纸上的每一句话作证。你若愿意再来，先看田畴图中没有画出的地方：一道渠旁有多少人家，一笔工数由谁承担。图不可能尽载，殿上也未必尽知。问到不明之处，便留一问；不必因为答话的人坐在这里，就将那一问收回去。","basis":"原创初识手札。田畴图与印章为虚构陈设；由询访政事得失的史料主题引出权力与认识的边界，不是太宗诏书。","sourceLabel":"《贞观政要》卷一 · 政体第二，弓工论材及询访得失","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷01"},{"threshold":30,"title":"顺耳的纸最轻","text":"来客：纸上若只剩顺耳之言，读它的人会以为自己不必再改。知道这一点，不等于每次都肯受问；被指出失处时，一时的不快仍会先到。你日后记下今夜，不必替这不快找一个好听的名字。把事情写清，也把尚未听见的声音留出位置。相知若有用处，该使彼此少一点装饰，而不是叫你替我把所有皱痕抚平。","basis":"原创相知手札。借求谏与受谏议题描写权力中的自我辩护；具体心理、纸页和来信均为艺术想象。","sourceLabel":"《贞观政要》卷二 · 求谏第四","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"},{"threshold":60,"title":"让未从之言留下","text":"来客：另有一页随行记，交你收束。看过田畴图，也去核核雨簿，再回殿前说你见到的差别。最后不必替我定一个千古的名目，只写下这一次答话有哪些凭据，又遗下哪些疑问。若有我不愿听的一句，你仍可以留下；若有你不曾看见的事，也不要代人作证。这页纸的分量，在于它能受后来的人追问，不在于印落得有多重。","basis":"原创知音手札及个人托付引子。保留未采纳议论取意于《论文史》；不视为真实起居注、诏敕或太宗自述。","sourceLabel":"《贞观政要》卷七 · 论文史第二十八","sourceUrl":"https://zh.wikisource.org/zh-hans/貞觀政要/卷07"}],"journey":{"quest":{"title":"印外的一页","intro":"李世民托你写一页随行记。看清图册的省略，核对雨簿的细节，再带着一句自己的追问回殿。你写的是个人所见，不是代拟新诏；原修缮卷的选择与结局照旧保存。","steps":[{"id":"li-shimin-step1","title":"地图没有画出的人","clue":"在两仪殿意象查看宫门外的田畴图，记下一处图中无法回答的问题。","place":"palace-court","object":"stone","target":"court-map","actionLabel":"为图外留一个问号","foundText":"图能画渠与田垄，不能替每户人说话。你记下“尚不知各家需工与农时”，没有把纸上的空白当成无人受影响的证据。"},{"id":"li-shimin-step2","title":"从总数退回损处","clue":"去议事廊核对仓廊雨损簿，把图前的问题与一处眼前可见的急损相对照。","place":"palace-west","object":"poem","target":"rain-report","actionLabel":"区分急处与未明处","foundText":"雨簿使你看见一处具体的急务，图册又提醒你还缺外间消息。你将两者并记：不能因信息不全就忘了漏雨，也不能因有一处急务便声称余事皆已明白。"},{"id":"li-shimin-step3","title":"殿前问印外之事","clue":"回两仪殿意象，走近李世民，把随行记中仍未得到回答的一问说出来。","place":"palace-court","object":"lantern","target":"li-shimin","actionLabel":"留下一句追问","foundText":"你问：“若这次取舍仍有代价，谁来记它？”殿中静了一瞬。他将笔推向你这一侧。你得到的不是所有问题的答案，而是继续写下问题的位置。"}]},"conversation":{"prompt":"李世民望向空白的随行笺：“这一页由你落笔。待你核问三处，对已说的话与尚无答复的事，你准备留下哪一种写法？”","choices":[{"id":"record-the-cost","label":"将取舍与代价并记，不为殿上修饰","response":"“写明你所据者，也写明未能见到者。”你没有添一方御印，只把有据的判断与可能的代价分成两行，使读者不必先相信一个名字。","endingTitle":"印外仍有字","endingText":"这页随行记没有把一夜写成盛世缩影，也未因看见缺处便抹去已做的事。它只让判断、代价与证据并排存下。这是本作的个人结卷，既不改写修缮奏议，也不自称补出真实史书的一页。"},{"id":"keep-the-question","label":"将未明之事逐条列出，留下可继续追问的次序","response":"“不要因今日还答不出，就把它们散失。”你将图外之人、实际工数与后续核验另列一页；没有答案之处，照实记作未明。","endingTitle":"殿前未尽之问","endingText":"你没有以一句“圣明”收尾，留下的是仍须补问的事情。宫门之外的生活没有被一张图替代，殿内的答话也没有封住后来的疑问。这份原创个人记录独立保存，原卷的落印或留议仍按玩家先前选择。"}]},"vignette":{"title":"灯下不必颂","lines":["两仪殿意象里收起了那页奏议，田畴图仍平铺案上。李世民问你，今夜哪一句话使你最不安心。","你没有另拟赞辞，只翻开那页尚有空处的随行记。他读到自己未能回答的一问，指尖停在纸边。","“便让它留下。”他说。你将笔收好；这一回相约，结束在可以再来的问题上。"],"closing":"原创知音相约。殿名仅作艺术空间，人物言语与心理均为创作，不是太宗真言或一次确凿夜间接见；回看不重复计分。"}}}},"scenery":{"city":["长安灯火","先收一城灯火，再把夜色交给远山。"],"alley":["坊巷灯影","月门半掩，留一盏灯给归来的人。"],"poem":["溪桥晚渡","乌篷过桥，柳影把水上的夜轻轻拉长。"],"village":["松风村舍","松风到檐下，炊烟将暮色留在人家。"],"mountains":["远山含黛","灯火渐远，让目光停在层层山黛之间。"],"waterfalls":["竹径听瀑","穿过竹影，今夜的脚步止于一川清响。"],"landscape":["山水全景","一城灯火近，数重山色远。"],"inn":["城西驿舍","檐下马声歇，灯边又一程。"],"avenue":["朱雀大街","长街望宫阙，灯火认归途。"],"west":["西市烟火","灯棚收晚市，余声入深巷。"],"east":["东市茶香","茶烟留夜客，楼影隔清风。"],"palace":["丹阙宫城","丹阙灯犹在，长廊月渐深。"],"lake":["曲江画舫","画舫泊曲岸，亭灯落水心。"],"temple":["古寺钟声","松影疏钟外，山月入禅门。"],"tower":["雁塔夜色","一塔立清夜，层檐接远星。"],"outer-west":["赭垣商旅坊","赭墙收灯影，方楼与客舍静候远行人。"],"outer-east":["碧瓦园林坊","碧瓦映花院，曲廊把一夜清风留在亭边。"],"southwest-courts":["青瓦书舍坊","白墙围书庭，青瓦檐下可听湖岸晚风。"],"southeast-crafts":["临湖工艺坊","暖瓦作坊临水，木楼晒架间还留着灯火。"]}};
(function(root){

 function create(catalog,storage,clock=()=>Date.now()){

   const row={answers,branch,completedSteps,vignetteSeen:false,metAt:stamp(r?.metAt),updatedAt:stamp(r?.updatedAt)};row.vignetteSeen=!!r?.vignetteSeen&&completedSteps===3&&points(id,row)>=60;return row;

<script id="palaceContent" type="application/json">{"id":"palace-night","title":"太极宫 · 贞观夜话","subtitle":"宫门入夜，一页奏议还未落印。","boundary":"以贞观人物所在的长安大内为背景，依据文献与遗址研究重建宫门、朝庭和内廷的空间秩序。太极宫未获全面发掘，本作门殿尺寸、间距、屋顶、配殿和装饰为研究性推定，非全宫一比一测绘复原；人物画像、陈设、来访与对谈仍为原创。太极宫是后世通称，贞观时称大内。","architecture":{"title":"循史营造 · 长安大内","intro":"从承天门，经太极门与太极殿前庭，再入两仪殿，向后寝与苑囿延伸。此次重做的是可步行的宫城核心游览段，不把推定的间架和尺度说成出土实测。","documented":["承天门、太极殿、两仪殿形成外朝、中朝、内朝的前后秩序。","承天门采用已探三门道方案；遗址不完整，完整门阙形制仍有讨论。","太极宫残图为宋元丰三年刻图，可参考殿名与区域关系，不能直接当成贞观现场测绘图。"],"inferred":["殿堂采用宽展屋面、深出檐、柱础、圆木朱柱、梁枋与大斗栱。曲面屋坡、瓦列、直棂窗、脊端鸱尾按唐构类型推定。","佛光寺东大殿是857年的佛殿，晚于贞观两百余年；仅借鉴保存的木构类型，不当作初唐宫殿原件。","本作太极殿的十一间柱网、屋顶形式、灰瓦设色、台基高度及门殿间距均为设计推定。侧楼、配殿、长廊和后苑位置同样不是已证实的太极宫遗址坐标。"],"story":"议事廊、后苑书阁与六件物证沿用原故事。宫中三人的来访、任务、手札与相约不代表史载事件；故事所处年代不混入高宗时期的大明宫含元殿。","features":["承天门三门道与门楼","太极门与开阔朝庭","太极殿台基、木构与四坡曲面屋顶","两仪殿与后寝院落","成组配殿、廊庑、后苑","原三位人物与全部任务保留"],"sources":[{"title":"陕西省志·建设志，第86页：长安宫城与太极宫","url":"https://dfz.shaanxi.gov.cn/zslm/fzzlk/xbsxsz/szdylpdf/201404/P020240923623109161543.pdf"},{"title":"西安碑林博物馆：太极宫残图（宋，1080）","url":"https://beilin-museum.com/index.php?a=index&aid=3400&c=View&m=home"},{"title":"香港教育局：中国木构建筑馆之模型，第2—3页","url":"https://www.edb.gov.hk/attachment/sc/curriculum-development/kla/pshe/references-and-resources/ethics-and-religious-studies/Nan_Lian_Garden/3iii_sc.pdf"}]},"intro":"你替宫中校书递送一页未定稿的修缮议。仓廊漏雨，殿饰也待更新；同一批木料、同一册工数，该先送往何处？先看物证，再听三人各说一句，最后由你替这页奏议留下一个落款。","characters":[{"id":"wei-zheng","name":"魏徵","role":"谏臣 · 议事廊","portrait":"wei-zheng.webp","era":"初唐 · 贞观时期","summary":"直言之前，先把账与实情看清。","history":"魏徵字玄成。早年曾事李建成，唐太宗即位后任用他为谏议大夫，后参与朝政。史籍记其多次进谏，也记他参与整理图籍、撰修史书；其形象不只是一位当面争辩的臣子。","note":"本卷借其进谏与恤民的思想设置修缮之议。廊中工簿、仓廊雨损及你与他的问答均为原创，不是史载的一次奏对。","sources":[{"title":"《旧唐书》卷七十一 · 魏徵传","url":"https://zh.wikisource.org/zh-hans/舊唐書/卷71"},{"title":"《贞观政要》卷二 · 任贤、求谏","url":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"}]},{"id":"empress-zhangsun","name":"长孙皇后","role":"文德皇后 · 后苑书阁","portrait":"empress-zhangsun.webp","era":"初唐 · 贞观时期","summary":"一寸衣料，也有宫墙之外的分量。","history":"长孙氏是唐太宗的皇后，后谥文德。史籍记她喜好读书、生活俭约，并劝太宗不要因自己的亲属关系过度任用外戚。她的个人名未见可靠记载，本卷不用后世虚构姓名替代史实。","note":"书阁与旧衣料是表现俭约主题的原创布景，不据此断言她曾在此处裁衣，或主持这份修缮议。画中服饰与面容也是艺术想象。","sources":[{"title":"《旧唐书》卷五十一 · 文德皇后长孙氏","url":"https://zh.wikisource.org/zh-hans/舊唐書/卷51"}]},{"id":"li-shimin","name":"李世民","role":"唐太宗 · 两仪殿意象","portrait":"li-shimin.webp","era":"初唐 · 贞观时期","summary":"落印容易，容得下不同的声音更难。","history":"李世民是唐朝第二位皇帝，庙号太宗，年号贞观。其统治与任贤、纳谏的政治记忆相连；他也经历了激烈的皇位争夺，不能把帝王的一生简化成没有矛盾的明君故事。","note":"本卷取纳谏与慎用民力的议题，不以你的选择改写真实诏令。两仪殿仅借历史殿名营造议事空间，台阶、陈设与夜间接见均未作考古复原。","sources":[{"title":"《旧唐书》卷二 · 太宗本纪上","url":"https://zh.wikisource.org/zh-hans/舊唐書/卷2"},{"title":"《贞观政要》卷二","url":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"}]}],"evidence":[{"id":"rain-report","name":"仓廊雨损簿","place":"议事廊","text":"纸上圈出三处漏缝，旁注：梁架尚稳，先补顶便可护粮。末尾另有一行细字——殿上彩绘褪色，尚未碍用。","object":"案上展开的雨损图"},{"id":"work-ledger","name":"木料与工簿","place":"议事廊","text":"库中余木足补漏顶；若连殿饰一并更新，便须另征工役。簿边压着一小块旧木：换一处新色，未必只耗这一寸木。","object":"压着旧木的工簿"},{"id":"silk-book","name":"衣料旧册","place":"后苑书阁","text":"新样册的封皮光亮，旧册却添了许多小注：未损可留，旧缣可补。你翻到最后，余料一项尚未写定去向。","object":"书案上的衣料册"},{"id":"plain-sleeve","name":"素衣与补线","place":"后苑书阁","text":"木架上挂着一段素色袖料，补线细而牢。它不炫目，却仍可用。阁中没有谁替你算好结论，只留下一个问题：体面一定要靠添新吗？","object":"木架上的素衣袖料"},{"id":"court-draft","name":"未落印的奏议","place":"两仪殿意象","text":"殿饰与仓廊被写在同一行，仿佛同样急迫。你将廊中所见另附一纸，纸的边缘仍留着魏徵圈点的墨痕。","object":"御案左侧的奏议"},{"id":"court-map","name":"宫门外的田畴图","place":"两仪殿意象","text":"图上并没有画出每一户人家，只有几道水渠和田垄。可工簿上每增一笔，都会有人离开这些田垄。夜深了，落款的地方仍是空白。","object":"御案右侧的田畴图"}],"chapters":[{"id":"remonstrance","person":"wei-zheng","name":"廊下听直言","needs":["rain-report","work-ledger"],"line":"魏徵把两册并排放下：『若把想做之事都写成急务，百姓便没有不忙的时候。你看过了，要怎样分这一批木料？』","choices":[{"id":"repair","label":"先补仓廊漏顶，殿饰缓修","reply":"『先后分明，才不是一句空泛的节用。』他把修缮次序写在纸边，却没有替你封住其他人的意见。"},{"id":"survey","label":"先核损情与工数，再分项列议","reply":"『求证也须给出期限，免得粮食只等来一叠新纸。』他在仓廊一栏加了急记，令你的复核有了轻重。"}]},{"id":"restraint","person":"empress-zhangsun","name":"书阁惜一寸","needs":["silk-book","plain-sleeve"],"line":"长孙皇后合上书：『取用之物，并非越新越合宜。若省下的只在册上好看，便还没省到地方。你愿怎样记这笔余料？』","choices":[{"id":"reuse","label":"先用可用旧料，余缣转作修补","reply":"她轻按那道补线：『物尽其用，也要让用物的人知道为何如此。』旧册添了一页去向，素衣没有被匆忙丢弃。"},{"id":"separate","label":"礼用与修缮分册核记，余料暂存","reply":"『分册之后，仍要相互看得见。』她将两册系在一起，提醒你规整的账目不能代替最后的照应。"}]},{"id":"audience","person":"li-shimin","name":"殿前留一言","needs":["court-draft","court-map"],"line":"李世民看完附纸，没有立刻取印：『若只要一份顺耳的答复，不必让你走这一程。现在，有人求快，有人求细，你愿替这页奏议留下什么？』","choices":[{"id":"seal","label":"先护仓粮，把不同意见一并附卷","reply":"印落在先护仓粮的一行，旁边仍留着未被划去的异议。殿门开启，纸上的工数终于有了清楚的去处。"},{"id":"recheck","label":"限定明日复核，今夜先作临时护盖","reply":"奏议没有强作定论，临时护盖却先送了出去。你把明日的期限写在封面，留下的是责任，并非一页无声的拖延。"}]}],"endings":{"lantern":{"title":"省一盏灯","text":"殿饰暂缓，余材先护仓粮。后苑一排装饰灯歇下，案上却多留了一盏读异议的灯。你带走的不是替古人作出的史实判决，而是这次夜访留下的取舍。"},"records":{"title":"两册并存","text":"仓廊先得修补，工数与用料各有去处。两份意见并排收进卷中：有了结论，也仍容得下日后核问。你没有把分歧抹平，只让它们留下可追索的字。"},"dawn":{"title":"灯下留议","text":"夜里的护盖先行，明日的复核有期。宫门将启时，案上仍留着未落的印；它不再是一种犹豫，而是一件有人接手、有人记得的事。"}},"sources":[{"title":"西安碑林博物馆 · 太极宫残图","url":"https://beilin-museum.com/index.php?a=index&aid=3400&c=View&m=home"},{"title":"《贞观政要》卷二","url":"https://zh.wikisource.org/zh-hans/貞觀政要/卷02"}]}</script>
